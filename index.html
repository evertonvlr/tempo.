<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d12;--card:#131720;--card2:#1a202b;--text:#f7f8fb;--muted:#9199a8;--line:#29313e;--accent:#7c5cff;--danger:#ff6574}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -20%,#171326 0,#0b0d12 45%);color:var(--text);min-height:100vh}
button,input,select{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}
.app{width:min(100%,1180px);margin:auto;padding:0 20px 48px}
header{height:76px;display:flex;align-items:center;justify-content:space-between}

.logo{font-size:21px;font-weight:850;letter-spacing:-.7px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:opacity .2s, transform .15s ease}
.logo:hover{opacity:0.75}
.logo:active{transform:scale(0.97)}
.logo span{color:var(--accent)}

.menu-btn{width:45px;height:45px;border:1px solid var(--line);border-radius:14px;background:rgba(19,23,32,.9);color:var(--text);font-size:23px;display:grid;place-items:center;transition:transform .15s ease, background .2s;outline:none}
.menu-btn:hover{transform:scale(1.04);background:var(--card2)}
.menu-btn:active{transform:scale(0.95);background:var(--card2)}

.hero{text-align:center;padding:48px 0 27px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.8px;margin-bottom:17px}
h1{font-size:clamp(37px,7vw,64px);line-height:1;letter-spacing:-2.8px;margin-bottom:15px}
.hero p{color:var(--muted);font-size:15px;line-height:1.6}
.panel{width:min(100%,760px);margin:auto;background:rgba(19,23,32,.94);border:1px solid var(--line);border-radius:24px;padding:23px;box-shadow:0 25px 80px rgba(0,0,0,.25);overflow:hidden}

.tabs{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin-bottom:23px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:11px 8px;border-radius:10px;font-weight:750;font-size:13px;transition:.2s}
.tab.active{background:var(--card2);color:var(--text);box-shadow:0 3px 12px rgba(0,0,0,.15)}

/* Correção crítica para Safari/iOS: minmax(0, 1fr) impede que inputs estourem o grid */
.grid{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px}
.field{min-width:0}
.field label{display:block;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.5px;margin:0 0 8px 3px}

input,select{width:100%;max-width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:12px 14px;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.12)}
select{cursor:pointer}

.result{margin-top:20px;padding:21px;border:1px solid var(--line);background:var(--bg);border-radius:16px;text-align:center;display:none;transition:border-color 0.2s}
.result.show{display:block;animation:up .25s ease-out}
.result .big{font-size:clamp(22px,4.5vw,30px);font-weight:900;letter-spacing:-1px}
.result .small{color:var(--muted);margin-top:7px;font-size:13px;line-height:1.5}
.error{color:var(--danger)!important}
.result.has-copy{cursor:pointer;position:relative;padding-bottom:30px}
.result.has-copy::after{content:'Clique no card para copiar';position:absolute;bottom:10px;left:0;right:0;font-size:11px;font-weight:750;color:var(--muted);opacity:0.6;transition:0.2s}
.result.has-copy:hover::after{opacity:1;color:var(--accent)}
.result.has-copy.copied{border-color:#4ade80}
.result.has-copy.copied::after{content:'✓ Copiado!';color:#4ade80;opacity:1}

.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.drawer.open{opacity:1;pointer-events:auto}
.drawer-card{position:absolute;right:0;top:0;height:100%;width:min(350px,89vw);background:#10141c;border-left:1px solid var(--line);padding:22px;transform:translateX(100%);transition:.3s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.drawer.open .drawer-card{transform:translateX(0)}

.drawer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;font-size:18px}
.close{border:0;background:var(--card);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:21px}
.menu-group{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.8px;margin:18px 0 8px 4px}
.menu-item{width:100%;text-align:left;padding:12px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;margin-bottom:8px;font-weight:750;font-size:14px;transition:.2s}
.menu-item:hover,.menu-item.active{border-color:var(--accent);background:var(--card2)}
.menu-item span{opacity:.9}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:42px}
footer a{color:var(--muted);text-decoration:none;transition:.2s}
footer a:hover{color:var(--accent)}
@keyframes up{from{opacity:0;transform:translateY(8px) scale(0.98)}to{opacity:1;transform:none}}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
@media(max-width:600px){.app{padding:0 14px 35px}.hero{padding:38px 0 22px}.panel{padding:17px;border-radius:20px}h1{letter-spacing:-2px}.tabs{margin-bottom:19px}.tab{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo" id="logoBtn">tempo<span>.</span></div>
  <button class="menu-btn" id="openMenu" aria-label="Abrir menu">☰</button>
</header>

<main>
<section class="hero">
  <div class="badge" id="toolBadge">UTILITÁRIO DE TEMPO</div>
  <h1 id="title">Calculadora de Data</h1>
  <p id="subtitle">Descubra exatamente quanto tempo existe entre duas datas.</p>
</section>
<section class="panel" id="tool"></section>
</main>
<footer>Simples. Rápido. Preciso. &nbsp;·&nbsp; <a href="privacidade.html">Política de Privacidade</a></footer>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-card">
    <div class="drawer-top"><strong>Utilitários</strong><button class="close" id="closeMenu" aria-label="Fechar menu">×</button></div>
    
    <div class="menu-group">ESSENCIAIS</div>
    <button class="menu-item active" data-tool="date">📅 &nbsp; Calculadora de Data</button>
    <button class="menu-item" data-tool="time">⏰ &nbsp; Calculadora de Horas</button>
    <button class="menu-item" data-tool="business">💼 &nbsp; Dias Úteis</button>
    
    <div class="menu-group">PESSOAL & VIDA</div>
    <button class="menu-item" data-tool="age">🎂 &nbsp; Idade Exata</button>
    <button class="menu-item" data-tool="pregnancy">👶 &nbsp; Gestação & Parto</button>
    <button class="menu-item" data-tool="countdown">⏳ &nbsp; Contagem Regressiva</button>
    
    <div class="menu-group">TRABALHISTAS (CLT)</div>
    <button class="menu-item" data-tool="overtime">⏱️ &nbsp; Horas Extras (CLT)</button>
    <button class="menu-item" data-tool="vacation13">🏖️ &nbsp; Férias & 13º Salário</button>
    <button class="menu-item" data-tool="rescision">📄 &nbsp; Rescisão CLT (Acerto)</button>
    
    <div class="menu-group">ESPORTE & PERFORMANCE</div>
    <button class="menu-item" data-tool="running">🏃 &nbsp; Parciais de Corrida (Splits)</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const $ = s => document.querySelector(s);
  const tool = $("#tool"), drawer = $("#drawer"), openMenuBtn = $("#openMenu"), closeMenuBtn = $("#closeMenu"), logoBtn = $("#logoBtn"), toolBadge = $("#toolBadge"), pageTitle = $("#pageTitle"), titleEl = $("#title"), subtitleEl = $("#subtitle");
  
  const validTools = ['date', 'time', 'business', 'age', 'pregnancy', 'countdown', 'overtime', 'vacation13', 'rescision', 'running'];
  let activeTool = 'date';
  
  const toolMeta = {
    date: { title: "Calculadora de Data", subtitle: "Descubra exatamente quanto tempo existe entre duas datas.", badge: "UTILITÁRIO DE TEMPO", page: "tempo. — Calculadora de Data" },
    time: { title: "Calculadora de Horas", subtitle: "Calcule a diferença entre dois horários.", badge: "UTILITÁRIO DE TEMPO", page: "tempo. — Calculadora de Horas" },
    business: { title: "Calculadora de Dias Úteis", subtitle: "Calcule prazos desconsiderando os finais de semana.", badge: "UTILITÁRIO DE TEMPO", page: "tempo. — Calculadora de Dias Úteis" },
    age: { title: "Calculadora de Idade Exata", subtitle: "Descubra sua idade em anos, meses e dias.", badge: "PESSOAL & VIDA", page: "tempo. — Calculadora de Idade Exata" },
    pregnancy: { title: "Calculadora de Gestação", subtitle: "Estime a idade gestacional e a data provável do parto.", badge: "PESSOAL & VIDA", page: "tempo. — Calculadora de Gestação" },
    countdown: { title: "Contagem Regressiva", subtitle: "Meça o tempo que falta para um grande evento ou quanto tempo já passou.", badge: "PESSOAL & VIDA", page: "tempo. — Contagem Regressiva" },
    overtime: { title: "Horas Extras (CLT)", subtitle: "Estime o valor da sua hora e o acréscimo por horas extras trabalhadas.", badge: "UTILITÁRIO TRABALHISTA", page: "tempo. — Horas Extras CLT" },
    vacation13: { title: "Férias & 13º Salário (CLT)", subtitle: "Estime os valores proporcionais seguindo as normas trabalhistas.", badge: "UTILITÁRIO TRABALHISTA", page: "tempo. — Férias e 13º Salário CLT" },
    rescision: { title: "Rescisão CLT (Acerto)", subtitle: "Estime rapidamente os valores devidos em caso de encerramento de contrato.", badge: "UTILITÁRIO TRABALHISTA", page: "tempo. — Rescisão CLT" },
    running: { title: "Parciais de Corrida (Splits)", subtitle: "Descubra o ritmo por quilômetro necessário para atingir sua meta de tempo.", badge: "ESPORTE & PERFORMANCE", page: "tempo. — Parciais de Corrida" }
  };
  
  try {
    const saved = localStorage.getItem('tempo_tool');
    if (saved && validTools.includes(saved)) {
      activeTool = saved;
    }
  } catch (e) {}

  function saveTool(t) {
    try { localStorage.setItem('tempo_tool', t); } catch(e) {}
  }

  let dateMode = "diff";
  let businessMode = "diff";
  let vacationMode = "13";
  let countMode = "down";
  let textToCopy = "";

  const getLocalISODate = (d = new Date()) => {
    const adjusted = new Date(d);
    adjusted.setMinutes(adjusted.getMinutes() - adjusted.getTimezoneOffset());
    return adjusted.toISOString().slice(0, 10);
  };

  function dateFromInput(id) {
    const v = $(id).value;
    return v ? new Date(v + "T00:00:00") : null;
  }

  function formatDate(d) {
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  function calendarDifference(start, end) {
    if (start > end) { let temp = start; start = end; end = temp; }
    let y = end.getFullYear() - start.getFullYear();
    let m = end.getMonth() - start.getMonth();
    let d = end.getDate() - start.getDate();
    if (d < 0) {
      m--;
      const previousMonth = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
      d += previousMonth;
    }
    if (m < 0) { y--; m += 12; }
    const utcStart = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
    const utcEnd = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());
    const total = Math.round((utcEnd - utcStart) / 86400000);
    return { y, m, d, total };
  }

  function businessDaysDifference(start, end) {
    if (start > end) { let temp = start; start = end; end = temp; }
    let count = 0; let cur = new Date(start);
    while (cur <= end) {
      const day = cur.getDay();
      if (day !== 0 && day !== 6) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return count;
  }

  function addBusinessDays(base, n, isAdd = true) {
    let cur = new Date(base); let added = 0; const dir = isAdd ? 1 : -1;
    while (added < n) {
      cur.setDate(cur.getDate() + dir);
      const day = cur.getDay();
      if (day !== 0 && day !== 6) added++;
    }
    return cur;
  }

  function showResult(html, plainText = "", error = false) {
    const r = $("#result");
    if(r) {
      textToCopy = plainText;
      r.innerHTML = html;
      r.classList.remove("show", "copied");
      void r.offsetWidth; 
      r.classList.add("show");
      
      if (error) {
        r.classList.add("error");
        r.classList.remove("has-copy");
      } else {
        r.classList.remove("error");
        if(textToCopy) r.classList.add("has-copy");
      }
    }
  }

  document.addEventListener('click', e => {
    const r = e.target.closest('.result.has-copy');
    if (r && !r.classList.contains('error') && textToCopy) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          r.classList.add('copied');
          setTimeout(() => r.classList.remove('copied'), 2000);
        }).catch(()=>{}); 
      } else {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = textToCopy;
          textArea.style.position = "fixed"; 
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          r.classList.add('copied');
          setTimeout(() => r.classList.remove('copied'), 2000);
        } catch(err) {}
      }
    }
  });

  // --- RENDERIZADORES DE FERRAMENTAS ---

  function renderDate() {
    tool.innerHTML = `
      <div class="tabs">
        <button class="tab ${dateMode === "diff" ? "active" : ""}" data-mode="diff">Diferença</button>
        <button class="tab ${dateMode === "add" ? "active" : ""}" data-mode="add">Adicionar</button>
        <button class="tab ${dateMode === "sub" ? "active" : ""}" data-mode="sub">Subtrair</button>
      </div>
      <div id="dateArea"></div>`;
    renderDateArea();
  }

  function renderDateArea() {
    const area = $("#dateArea");
    if (dateMode === "diff") {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="date1">DATA INICIAL</label><input type="date" id="date1"></div>
          <div class="field"><label for="date2">DATA FINAL</label><input type="date" id="date2"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      $("#date1").value = getLocalISODate();
      $("#date2").value = getLocalISODate();
      
      const calculate = () => {
        const a = dateFromInput("#date1"), b = dateFromInput("#date2");
        if(!a || !b) return showResult("Selecione as duas datas.", "", true);
        const x = calendarDifference(a, b);
        const html = `<div class="big">${x.y} ${x.y===1?"ano":"anos"}, ${x.m} ${x.m===1?"mês":"meses"} e ${x.d} ${x.d===1?"dia":"dias"}</div><div class="small">Total: ${x.total.toLocaleString("pt-BR")} ${x.total===1?"dia":"dias"}</div>`;
        const plainText = `Diferença entre datas: ${x.y} anos, ${x.m} meses e ${x.d} dias (Total de ${x.total} dias).`;
        showResult(html, plainText);
      };
      
      $("#date1").oninput = calculate; $("#date2").oninput = calculate; calculate();
    } else {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="baseDate">DATA</label><input type="date" id="baseDate"></div>
          <div class="field"><label for="days">QUANTIDADE DE DIAS</label><input type="number" id="days" min="0" step="1" placeholder="Ex.: 45" value="30"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      $("#baseDate").value = getLocalISODate();
      
      const calculate = () => {
        const base = dateFromInput("#baseDate"), n = Number($("#days").value);
        if(!base || $("#days").value === "" || !Number.isInteger(n) || n < 0) return showResult("Informe uma data e uma quantidade válida de dias.", "", true);
        const d = new Date(base);
        d.setDate(d.getDate() + (dateMode === "add" ? n : -n));
        const html = `<div class="big">${formatDate(d)}</div><div class="small">${dateMode==="add"?"Foram adicionados":"Foram subtraídos"} ${n.toLocaleString("pt-BR")} ${n===1?"dia":"dias"} de ${formatDate(base)}.</div>`;
        const plainText = `Resultado: ${formatDate(d)} (${dateMode==="add"?"Adicionados":"Subtraídos"} ${n} dias de ${formatDate(base)}).`;
        showResult(html, plainText);
      };
      
      $("#baseDate").oninput = calculate; $("#days").oninput = calculate; calculate();
    }
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => { dateMode = b.dataset.mode; renderDate(); });
  }

  function renderTime() {
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label for="time1">HORÁRIO INICIAL</label><input type="time" id="time1"></div>
        <div class="field"><label for="time2">HORÁRIO FINAL</label><input type="time" id="time2"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    $("#time1").value = "08:00";
    $("#time2").value = "17:40";
    
    const calculate = () => {
      const a = $("#time1").value, b = $("#time2").value;
      if(!a || !b) return showResult("Informe os dois horários.", "", true);
      let [ah, am] = a.split(":").map(Number), [bh, bm] = b.split(":").map(Number);
      let start = ah * 60 + am, end = bh * 60 + bm;
      if(end < start) end += 1440;
      const total = end - start, h = Math.floor(total / 60), m = total % 60;
      const html = `<div class="big">${h}h ${m.toString().padStart(2, "0")}min</div><div class="small">Total: ${total.toLocaleString("pt-BR")} minutos</div>`;
      const plainText = `Diferença de horário: ${h}h ${m.toString().padStart(2, "0")}min (Total: ${total} minutos).`;
      showResult(html, plainText);
    };
    
    $("#time1").oninput = calculate; $("#time2").oninput = calculate; calculate();
  }

  function renderBusiness() {
    tool.innerHTML = `
      <div class="tabs">
        <button class="tab ${businessMode === "diff" ? "active" : ""}" data-mode="diff">Diferença</button>
        <button class="tab ${businessMode === "add" ? "active" : ""}" data-mode="add">Adicionar</button>
        <button class="tab ${businessMode === "sub" ? "active" : ""}" data-mode="sub">Subtrair</button>
      </div>
      <div id="businessArea"></div>`;
    renderBusinessArea();
  }

  function renderBusinessArea() {
    const area = $("#businessArea");
    if (businessMode === "diff") {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="bDate1">DATA INICIAL</label><input type="date" id="bDate1"></div>
          <div class="field"><label for="bDate2">DATA FINAL</label><input type="date" id="bDate2"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      const d2 = new Date(); d2.setDate(d2.getDate() + 15);
      $("#bDate1").value = getLocalISODate(); 
      $("#bDate2").value = getLocalISODate(d2);
      
      const calculate = () => {
        const a = dateFromInput("#bDate1"), b = dateFromInput("#bDate2");
        if(!a || !b) return showResult("Selecione as duas datas.", "", true);
        const total = businessDaysDifference(a, b);
        const html = `<div class="big">${total.toLocaleString("pt-BR")} ${total===1?"dia útil":"dias úteis"}</div><div class="small">Intervalo desconsiderando sábados e domingos.</div>`;
        const plainText = `Existem ${total} dias úteis entre ${formatDate(a)} e ${formatDate(b)}.`;
        showResult(html, plainText);
      };
      
      $("#bDate1").oninput = calculate; $("#bDate2").oninput = calculate; calculate();
    } else {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="bBaseDate">DATA</label><input type="date" id="bBaseDate"></div>
          <div class="field"><label for="bDays">DIAS ÚTEIS</label><input type="number" id="bDays" min="0" step="1" placeholder="Ex.: 10" value="10"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      $("#bBaseDate").value = getLocalISODate();
      
      const calculate = () => {
        const base = dateFromInput("#bBaseDate"), n = Number($("#bDays").value);
        if(!base || $("#bDays").value === "" || !Number.isInteger(n) || n < 0) return showResult("Informe uma data e quantidade.", "", true);
        const d = addBusinessDays(base, n, businessMode === "add");
        const html = `<div class="big">${formatDate(d)}</div><div class="small">${businessMode==="add"?"Data após adicionar":"Data após subtrair"} ${n.toLocaleString("pt-BR")} ${n===1?"dia útil":"dias úteis"}.</div>`;
        const plainText = `Resultado: ${formatDate(d)} (${businessMode==="add"?"Adicionados":"Subtraídos"} ${n} dias úteis de ${formatDate(base)}).`;
        showResult(html, plainText);
      };
      
      $("#bBaseDate").oninput = calculate; $("#bDays").oninput = calculate; calculate();
    }
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => { businessMode = b.dataset.mode; renderBusiness(); });
  }

  function renderAge() {
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label for="birthDate">DATA DE NASCIMENTO</label><input type="date" id="birthDate"></div>
        <div class="field"><label for="refDate">DATA DE REFERÊNCIA (HOJE)</label><input type="date" id="refDate"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    $("#birthDate").value = "2000-01-01";
    $("#refDate").value = getLocalISODate();
    
    const calculate = () => {
      const birth = dateFromInput("#birthDate"), ref = dateFromInput("#refDate");
      if(!birth || !ref) return showResult("Selecione as datas corretamente.", "", true);
      if(birth > ref) return showResult("A data de nascimento não pode ser futura.", "", true);
      const x = calendarDifference(birth, ref);
      const html = `<div class="big">${x.y} anos, ${x.m} meses e ${x.d} dias</div><div class="small">Total aproximado de ${x.total.toLocaleString("pt-BR")} dias vividos.</div>`;
      const plainText = `Idade: ${x.y} anos, ${x.m} meses e ${x.d} dias (Aprox. ${x.total} dias vividos).`;
      showResult(html, plainText);
    };
    
    $("#birthDate").oninput = calculate; $("#refDate").oninput = calculate; calculate();
  }

  function renderPregnancy() {
    tool.innerHTML = `
      <div class="grid" style="grid-template-columns:1fr">
        <div class="field"><label for="dumDate">DATA DA ÚLTIMA MENSTRUAÇÃO (DUM)</label><input type="date" id="dumDate"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    const past = new Date(); past.setDate(past.getDate() - 84); 
    $("#dumDate").value = getLocalISODate(past);
    
    const calculate = () => {
      const dum = dateFromInput("#dumDate");
      if(!dum) return showResult("Informe a data da última menstruação.", "", true);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      if(dum > today) return showResult("A DUM não pode ser uma data futura.", "", true);
      
      const diffDays = Math.floor((today - dum) / 86400000);
      const weeks = Math.floor(diffDays / 7);
      const days = diffDays % 7;
      const dueDate = new Date(dum); dueDate.setDate(dueDate.getDate() + 280); 
      
      const html = `<div class="big">${weeks} semanas e ${days} dias</div><div class="small">Previsão do parto: <strong>${formatDate(dueDate)}</strong> (40 semanas).</div>`;
      const plainText = `Gestação: ${weeks} semanas e ${days} dias. Previsão do parto: ${formatDate(dueDate)}.`;
      showResult(html, plainText);
    };
    
    $("#dumDate").oninput = calculate; calculate();
  }

  function renderCountdown() {
    tool.innerHTML = `
      <div class="tabs">
        <button class="tab ${countMode === "down" ? "active" : ""}" data-mode="down">Contagem Regressiva</button>
        <button class="tab ${countMode === "passed" ? "active" : ""}" data-mode="passed">Tempo Passado</button>
      </div>
      <div id="countArea"></div>`;
    renderCountArea();
  }

  function renderCountArea() {
    const area = $("#countArea");
    area.innerHTML = `
      <div class="grid">
        <div class="field"><label for="evName">NOME DO EVENTO / MARCO</label><input type="text" id="evName" placeholder="Ex.: Férias, Aniversário..." value="Férias"></div>
        <div class="field"><label for="evDate">DATA</label><input type="date" id="evDate"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    const target = new Date(); target.setDate(target.getDate() + 30);
    $("#evDate").value = getLocalISODate(target);
    
    const calculate = () => {
      const name = $("#evName").value || "Evento";
      const evDate = dateFromInput("#evDate");
      if(!evDate) return showResult("Selecione uma data válida.", "", true);
      
      const today = new Date(); today.setHours(0,0,0,0);
      const x = calendarDifference(today, evDate);
      
      if (countMode === "down") {
        if (today > evDate) {
          showResult(`A data escolhida já passou!`, "", true);
          return;
        }
        const html = `<div class="big">${x.total.toLocaleString("pt-BR")} ${x.total===1?"dia":"dias"}</div><div class="small">Faltam ${x.y} anos, ${x.m} meses e ${x.d} dias para ${name}.</div>`;
        const plainText = `Faltam ${x.total} dias (${x.y} anos, ${x.m} meses e ${x.d} dias) para ${name}!`;
        showResult(html, plainText);
      } else {
        if (today < evDate) {
          showResult(`A data escolhida é futura!`, "", true);
          return;
        }
        const html = `<div class="big">${x.total.toLocaleString("pt-BR")} ${x.total===1?"dia":"dias"}</div><div class="small">Já se passaram ${x.y} anos, ${x.m} meses e ${x.d} dias desde ${name}.</div>`;
        const plainText = `Já se passaram ${x.total} dias (${x.y} anos, ${x.m} meses e ${x.d} dias) desde ${name}!`;
        showResult(html, plainText);
      }
    };
    
    $("#evName").oninput = calculate;
    $("#evDate").oninput = calculate;
    calculate();
    
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => { countMode = b.dataset.mode; renderCountdown(); });
  }

  function renderOvertime() {
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label for="sal">SALÁRIO MENSAL (R$)</label><input type="number" id="sal" step="0.01" min="0" value="1621"></div>
        <div class="field"><label for="jor">JORNADA MENSAL (HORAS)</label><input type="number" id="jor" value="220" min="1" step="1"></div>
      </div>
      <div class="grid" style="margin-top:14px">
        <div class="field"><label for="qtd">QTD. DE HORAS EXTRAS</label><input type="number" id="qtd" step="0.5" min="0" value="10"></div>
        <div class="field"><label for="rate">ACRÉSCIMO LEGAL (CLT)</label>
          <select id="rate">
            <option value="50">50% (Dias normais / úteis)</option>
            <option value="100">100% (Domingos e feriados)</option>
          </select>
        </div>
      </div>
      <div class="result" id="result"></div>`;
      
    const calculate = () => {
      const sal = Number($("#sal").value), jor = Number($("#jor").value), qtd = Number($("#qtd").value), rate = Number($("#rate").value);
      if(!sal || sal<=0 || !jor || jor<=0 || isNaN(qtd) || qtd<0) return showResult("Informe valores válidos para o cálculo.", "", true);
      
      const valorHora = sal / jor;
      const valorHoraExtra = valorHora * (1 + rate / 100);
      const total = valorHoraExtra * qtd;
      
      const html = `
        <div class="big">R$ ${total.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="small">Valor da hora normal: R$ ${valorHora.toFixed(2)}<br>Valor da hora extra (${rate}%): R$ ${valorHoraExtra.toFixed(2)}</div>
        <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">* Valores estimados para fins orientativos. Consulte o RH ou um profissional contábil.</div>
      `;
      const plainText = `Total de Horas Extras (${qtd}h a ${rate}%): R$ ${total.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}. Base salarial: R$ ${sal}.`;
      showResult(html, plainText);
    };
    
    $("#sal").oninput = calculate; $("#jor").oninput = calculate; $("#qtd").oninput = calculate; $("#rate").onchange = calculate;
    calculate();
  }

  function renderVacation13() {
    tool.innerHTML = `
      <div class="tabs">
        <button class="tab ${vacationMode === "13" ? "active" : ""}" data-mode="13">13º Salário</button>
        <button class="tab ${vacationMode === "vacation" ? "active" : ""}" data-mode="vacation">Férias + 1/3</button>
      </div>
      <div id="vArea"></div>`;
    renderVArea();
  }

  function renderVArea() {
    const area = $("#vArea");
    if(vacationMode === "13"){
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="vSal">SALÁRIO BRUTO (R$)</label><input type="number" id="vSal" step="0.01" min="0" value="1621"></div>
          <div class="field"><label for="vMeses">MESES TRABALHADOS NO ANO (1 a 12)</label><input type="number" id="vMeses" min="1" max="12" value="12"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      const calculate = () => {
        const sal = Number($("#vSal").value), meses = Number($("#vMeses").value);
        if(!sal || sal<=0 || !meses || meses<1 || meses>12) return showResult("Informe valores válidos.", "", true);
        
        const val = (sal / 12) * meses;
        const html = `
          <div class="big">R$ ${val.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
          <div class="small">Proporcional a ${meses} ${meses===1?"mês trabalhado":"meses trabalhados"}.</div>
          <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">* Valores estimados para fins orientativos. Consulte o RH ou um profissional contábil.</div>
        `;
        const plainText = `13º Salário Proporcional (${meses} meses, base R$ ${sal}): R$ ${val.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}.`;
        showResult(html, plainText);
      };
      
      $("#vSal").oninput = calculate; $("#vMeses").oninput = calculate; calculate();
    } else {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="vSal">SALÁRIO BRUTO (R$)</label><input type="number" id="vSal" step="0.01" min="0" value="1621"></div>
          <div class="field"><label for="vMeses">MESES NO PERÍODO (1 a 12)</label><input type="number" id="vMeses" min="1" max="12" value="12"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      const calculate = () => {
        const sal = Number($("#vSal").value), meses = Number($("#vMeses").value);
        if(!sal || sal<=0 || !meses || meses<1 || meses>12) return showResult("Informe valores válidos.", "", true);
        
        const base = (sal / 12) * meses;
        const terço = base / 3;
        const total = base + terço;
        const html = `
          <div class="big">R$ ${total.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
          <div class="small">Férias proporcionais: R$ ${base.toFixed(2)}<br>Terço constitucional (1/3): R$ ${terço.toFixed(2)}</div>
          <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">* Valores estimados para fins orientativos. Consulte o RH ou um profissional contábil.</div>
        `;
        const plainText = `Férias Proporcionais + 1/3 (${meses} meses, base R$ ${sal}): R$ ${total.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}.`;
        showResult(html, plainText);
      };
      
      $("#vSal").oninput = calculate; $("#vMeses").oninput = calculate; calculate();
    }
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => { vacationMode = b.dataset.mode; renderVacation13(); });
  }

  function renderRescision() {
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label for="rSal">SALÁRIO BRUTO (R$)</label><input type="number" id="rSal" step="0.01" min="0" value="2500"></div>
        <div class="field"><label for="rReason">MOTIVO DA SAÍDA</label>
          <select id="rReason">
            <option value="sem_justa">Dispensa sem justa causa</option>
            <option value="pedido">Pedido de demissão</option>
            <option value="acordo">Acordo comum (Art. 484-A)</option>
          </select>
        </div>
      </div>
      <div class="grid" style="margin-top:14px">
        <div class="field"><label for="rAdm">DATA DE ADMISSÃO</label><input type="date" id="rAdm"></div>
        <div class="field"><label for="rTerm">DATA DE DEMISSÃO</label><input type="date" id="rTerm"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    const today = new Date();
    const adm = new Date(); adm.setFullYear(adm.getFullYear() - 2);
    $("#rAdm").value = getLocalISODate(adm);
    $("#rTerm").value = getLocalISODate(today);
    
    const calculate = () => {
      const sal = Number($("#rSal").value);
      const reason = $("#rReason").value;
      const dAdm = dateFromInput("#rAdm");
      const dTerm = dateFromInput("#rTerm");
      
      if(!sal || sal<=0 || !dAdm || !dTerm) return showResult("Preencha todos os campos corretamente.", "", true);
      if(dAdm > dTerm) return showResult("A data de admissão não pode ser posterior à demissão.", "", true);
      
      const timeDiff = calendarDifference(dAdm, dTerm);
      const totalMonthsWorked = timeDiff.y * 12 + timeDiff.m;
      
      const termDay = dTerm.getDate();
      const saldoSalario = (sal / 30) * termDay;
      
      const monthsCurrentYear = dTerm.getMonth() + 1;
      const decimoTerceiro = (sal / 12) * monthsCurrentYear;
      
      const feriasBase = (sal / 12) * (totalMonthsWorked % 12 || 12);
      const feriasTotal = feriasBase + (feriasBase / 3);
      
      let avisoPrevio = 0;
      if (reason === "sem_justa") {
        const extraDays = Math.min(timeDiff.y * 3, 60);
        const totalAvisoDays = 30 + extraDays;
        avisoPrevio = (sal / 30) * totalAvisoDays;
      } else if (reason === "acordo") {
        const extraDays = Math.min(timeDiff.y * 3, 60);
        const totalAvisoDays = 30 + extraDays;
        avisoPrevio = ((sal / 30) * totalAvisoDays) / 2;
      }
      
      const totalEstimatedFGTS = (sal * 0.08) * totalMonthsWorked;
      let multaFgts = 0;
      if (reason === "sem_justa") {
        multaFgts = totalEstimatedFGTS * 0.40;
      } else if (reason === "acordo") {
        multaFgts = totalEstimatedFGTS * 0.20;
      }
      
      const totalRescisao = saldoSalario + decimoTerceiro + feriasTotal + avisoPrevio + multaFgts;
      
      const html = `
        <div class="big">R$ ${totalRescisao.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="small" style="margin-top:8px; line-height:1.6;">
          Saldo de Salário: R$ ${saldoSalario.toFixed(2)}<br>
          ${reason !== 'pedido' ? `Aviso Prévio: R$ ${avisoPrevio.toFixed(2)}<br>` : ''}
          13º Proporcional: R$ ${decimoTerceiro.toFixed(2)}<br>
          Férias + 1/3: R$ ${feriasTotal.toFixed(2)}<br>
          ${multaFgts > 0 ? `Multa FGTS: R$ ${multaFgts.toFixed(2)}` : ''}
        </div>
        <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">* Valores estimados para fins orientativos. Consulte o RH ou um profissional contábil.</div>
      `;
      const plainText = `Estimativa de Rescisão CLT (${reason}): R$ ${totalRescisao.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}. Saldo: R$ ${saldoSalario.toFixed(2)}, 13º: R$ ${decimoTerceiro.toFixed(2)}, Férias: R$ ${feriasTotal.toFixed(2)}.`;
      showResult(html, plainText);
    };
    
    $("#rSal").oninput = calculate;
    $("#rReason").onchange = calculate;
    $("#rAdm").oninput = calculate;
    $("#rTerm").oninput = calculate;
    calculate();
  }

  function renderRunning() {
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label for="runDist">DISTÂNCIA DA PROVA / TREINO (KM)</label><input type="number" id="runDist" step="0.5" min="1" value="10"></div>
        <div class="field"><label for="runTime">TEMPO TOTAL DESEJADO (MINUTOS)</label><input type="number" id="runTime" min="1" step="1" value="50"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    const calculate = () => {
      const dist = Number($("#runDist").value);
      const totalMin = Number($("#runTime").value);
      
      if(!dist || dist <= 0 || !totalMin || totalMin <= 0) return showResult("Informe valores válidos.", "", true);
      
      const paceMinDecimal = totalMin / dist;
      const paceMin = Math.floor(paceMinDecimal);
      const paceSec = Math.round((paceMinDecimal - paceMin) * 60);
      const paceFormatted = `${paceMin}:${paceSec < 10 ? '0' : ''}${paceSec}`;
      
      const speedKmh = (dist / (totalMin / 60)).toFixed(1);
      
      const html = `
        <div class="big">${paceFormatted} <span style="font-size:16px; font-weight:normal; color:var(--muted);">min/km</span></div>
        <div class="small" style="margin-top:8px;">
          Velocidade média na esteira/rua: <strong>${speedKmh} km/h</strong><br>
          Para correr ${dist} km em ${totalMin} minutos.
        </div>
      `;
      const plainText = `Parcial de Corrida: ${paceFormatted} min/km (${speedKmh} km/h) para ${dist} km em ${totalMin} minutos.`;
      showResult(html, plainText);
    };
    
    $("#runDist").oninput = calculate;
    $("#runTime").oninput = calculate;
    calculate();
  }

  // --- CONTROLE DO MENU ---

  function loadTool(t) {
    activeTool = t;
    saveTool(t); 
    
    const meta = toolMeta[t] || toolMeta['date'];
    
    pageTitle.textContent = meta.page;
    titleEl.textContent = meta.title;
    subtitleEl.textContent = meta.subtitle;
    toolBadge.textContent = meta.badge;
    
    document.querySelectorAll(".menu-item").forEach(x => x.classList.remove("active"));
    const activeItem = document.querySelector(`.menu-item[data-tool="${t}"]`);
    if (activeItem) activeItem.classList.add("active");

    if (t === "date") renderDate();
    else if (t === "time") renderTime();
    else if (t === "business") renderBusiness();
    else if (t === "age") renderAge();
    else if (t === "pregnancy") renderPregnancy();
    else if (t === "countdown") renderCountdown();
    else if (t === "overtime") renderOvertime();
    else if (t === "vacation13") renderVacation13();
    else if (t === "rescision") renderRescision();
    else if (t === "running") renderRunning();
  }

  logoBtn.addEventListener('click', () => {
    drawer.classList.remove("open");
    loadTool('date');
  });

  openMenuBtn.addEventListener('click', () => {
    drawer.classList.add("open");
  });

  closeMenuBtn.addEventListener('click', () => {
    drawer.classList.remove("open");
  });

  drawer.addEventListener('click', (e) => {
    if (e.target === drawer) {
      drawer.classList.remove("open");
    }
  });

  document.querySelectorAll(".menu-item").forEach(item => {
    item.addEventListener('click', () => {
      drawer.classList.remove("open");
      loadTool(item.dataset.tool);
    });
  });

  loadTool(activeTool);
});
</script>
