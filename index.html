<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>tempo. — Utilitários</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230b0d12%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 font-weight=%22900%22 font-family=%22system-ui, sans-serif%22 fill=%22%23f7f8fb%22 text-anchor=%22middle%22>t<tspan fill=%22%237c5cff%22>.</tspan></text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d12;--card:#131720;--card2:#1a202b;--text:#f7f8fb;--muted:#9199a8;--line:#29313e;--accent:#7c5cff;--danger:#ff6574}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -20%,#171326 0,#0b0d12 45%);color:var(--text);min-height:100vh}
button,input{font:inherit}button{cursor:pointer}
.app{width:min(100%,1180px);margin:auto;padding:0 20px 48px}
header{height:76px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:21px;font-weight:850;letter-spacing:-.7px}.logo span{color:var(--accent)}
.menu-btn{width:45px;height:45px;border:1px solid var(--line);border-radius:14px;background:rgba(19,23,32,.9);color:var(--text);font-size:23px;display:grid;place-items:center;transition:.2s}
.menu-btn:hover{transform:scale(1.04);background:var(--card2)}
.hero{text-align:center;padding:48px 0 27px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.8px;margin-bottom:17px}
h1{font-size:clamp(37px,7vw,64px);line-height:1;letter-spacing:-2.8px;margin-bottom:15px}
.hero p{color:var(--muted);font-size:15px;line-height:1.6}
.panel{width:min(100%,760px);margin:auto;background:rgba(19,23,32,.94);border:1px solid var(--line);border-radius:24px;padding:23px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.tabs{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin-bottom:23px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:11px 8px;border-radius:10px;font-weight:750;font-size:13px;transition:.2s}
.tab.active{background:var(--card2);color:var(--text);box-shadow:0 3px 12px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.5px;margin:0 0 8px 3px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:14px;outline:none;transition:.2s;color-scheme:dark}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.12)}
.result{margin-top:20px;padding:21px;border:1px solid var(--line);background:var(--bg);border-radius:16px;text-align:center;display:none;transition:border-color 0.2s}
.result.show{display:block;animation:up .25s ease-out}
.result .big{font-size:clamp(22px,4.5vw,30px);font-weight:900;letter-spacing:-1px}
.result .small{color:var(--muted);margin-top:7px;font-size:13px;line-height:1.5}
.error{color:var(--danger)!important}
.result.has-copy{cursor:pointer;position:relative;padding-bottom:30px}
.result.has-copy::after{content:'Clique para copiar';position:absolute;bottom:10px;left:0;right:0;font-size:11px;font-weight:750;color:var(--muted);opacity:0.6;transition:0.2s}
.result.has-copy:hover::after{opacity:1;color:var(--accent)}
.result.has-copy.copied{border-color:#4ade80}
.result.has-copy.copied::after{content:'✓ Copiado!';color:#4ade80;opacity:1}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.drawer.open{opacity:1;pointer-events:auto}
.drawer-card{position:absolute;right:0;top:0;height:100%;width:min(350px,89vw);background:#10141c;border-left:1px solid var(--line);padding:22px;transform:translateX(100%);transition:.3s cubic-bezier(.2,.8,.2,1)}
.drawer.open .drawer-card{transform:translateX(0)}
.drawer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;font-size:18px}
.close{border:0;background:var(--card);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:21px}
.menu-item{width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;margin-bottom:10px;font-weight:750;font-size:14px;transition:.2s}
.menu-item:hover,.menu-item.active{border-color:var(--accent);background:var(--card2)}
.menu-item span{opacity:.9}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:42px}
footer a{color:var(--muted);text-decoration:none;transition:.2s}
footer a:hover{color:var(--accent)}
@keyframes up{from{opacity:0;transform:translateY(8px) scale(0.98)}to{opacity:1;transform:none}}
@media(max-width:600px){.app{padding:0 14px 35px}.hero{padding:38px 0 22px}.panel{padding:17px;border-radius:20px}.grid{grid-template-columns:1fr}h1{letter-spacing:-2px}.tabs{margin-bottom:19px}.tab{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">tempo<span>.</span></div>
  <button class="menu-btn" id="openMenu" aria-label="Abrir menu">☰</button>
</header>

<main>
<section class="hero">
  <div class="badge" id="toolBadge">UTILITÁRIOS DE TEMPO</div>
  <h1 id="title">Carregando...</h1>
  <p id="subtitle">Preparando utilitários</p>
</section>
<section class="panel" id="tool"></section>
</main>
<footer>Simples. Rápido. Preciso. &nbsp;·&nbsp; <a href="privacidade.html">Política de Privacidade</a></footer>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-card">
    <div class="drawer-top"><strong>Utilitários</strong><button class="close" id="closeMenu" aria-label="Fechar menu">×</button></div>
    <button class="menu-item" data-tool="date">📅 &nbsp; Calculadora de Data</button>
    <button class="menu-item" data-tool="time">⏰ &nbsp; Calculadora de Horas</button>
    <button class="menu-item" data-tool="business">💼 &nbsp; Dias Úteis</button>
    <button class="menu-item" data-tool="age">🎂 &nbsp; Idade Exata</button>
    <button class="menu-item" data-tool="pregnancy">👶 &nbsp; Gestação & Parto</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const $ = s => document.querySelector(s);
  const tool = $("#tool"), drawer = $("#drawer"), openMenuBtn = $("#openMenu"), closeMenuBtn = $("#closeMenu");
  
  // Memória Local Segura (LocalStorage com Try/Catch)
  function saveTool(t) { try { localStorage.setItem('tempo_tool', t); } catch(e) {} }
  function getSavedTool() { try { return localStorage.getItem('tempo_tool'); } catch(e) { return null; } }

  // Estados Globais
  let activeTool = getSavedTool() || 'date';
  let dateMode = "diff";
  let businessMode = "diff";
  let textToCopy = ""; // Armazena texto para Clipboard

  // Lendo parâmetros compartilháveis da URL (sobrepõe a memória local)
  const bootParams = new URLSearchParams(window.location.search);
  if (bootParams.has('tool')) {
    activeTool = bootParams.get('tool');
    if (activeTool === 'date' && bootParams.has('mode')) dateMode = bootParams.get('mode');
    if (activeTool === 'business' && bootParams.has('mode')) businessMode = bootParams.get('mode');
  }

  // Atualizador Seguro de URL Dinâmica
  const setURLParams = (paramsObj) => {
    const url = new URL(window.location);
    url.search = '';
    url.searchParams.set('tool', activeTool);
    for (let k in paramsObj) {
      if (paramsObj[k] !== null && paramsObj[k] !== "") url.searchParams.set(k, paramsObj[k]);
    }
    history.replaceState(null, '', url);
  };

  // Funções Utilitárias Blindadas
  const getLocalISODate = (d = new Date()) => {
    const adjusted = new Date(d);
    adjusted.setMinutes(adjusted.getMinutes() - adjusted.getTimezoneOffset());
    return adjusted.toISOString().slice(0, 10);
  };

  const getModeVal = (mode, param, defaultVal) => {
    const p = new URLSearchParams(window.location.search);
    if(p.get('tool') === activeTool && p.get('mode') === mode && p.has(param)) return p.get(param);
    return defaultVal;
  };

  const getVal = (param, defaultVal) => {
    const p = new URLSearchParams(window.location.search);
    if(p.get('tool') === activeTool && p.has(param)) return p.get(param);
    return defaultVal;
  };

  function dateFromInput(id) {
    const v = $(id).value;
    return v ? new Date(v + "T00:00:00") : null;
  }

  function formatDate(d) {
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  // Matemática de Tempo (Horário de Verão Seguro)
  function calendarDifference(start, end) {
    if (start > end) { let temp = start; start = end; end = temp; }
    let y = end.getFullYear() - start.getFullYear();
    let m = end.getMonth() - start.getMonth();
    let d = end.getDate() - start.getDate();
    if (d < 0) {
      m--;
      const previousMonth = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
      d += previousMonth;
    }
    if (m < 0) { y--; m += 12; }
    const utcStart = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
    const utcEnd = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());
    const total = Math.round((utcEnd - utcStart) / 86400000);
    return { y, m, d, total };
  }

  function businessDaysDifference(start, end) {
    if (start > end) { let temp = start; start = end; end = temp; }
    let count = 0; let cur = new Date(start);
    while (cur <= end) {
      const day = cur.getDay();
      if (day !== 0 && day !== 6) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return count;
  }

  function addBusinessDays(base, n, isAdd = true) {
    let cur = new Date(base); let added = 0; const dir = isAdd ? 1 : -1;
    while (added < n) {
      cur.setDate(cur.getDate() + dir);
      const day = cur.getDay();
      if (day !== 0 && day !== 6) added++;
    }
    return cur;
  }

  // Exibição e Copiar Resultado (UX Premium)
  function showResult(html, plainText = "", error = false) {
    const r = $("#result");
    if(r) {
      textToCopy = plainText;
      r.innerHTML = html;
      r.classList.remove("show", "copied");
      void r.offsetWidth; // Gatilho visual
      r.classList.add("show");
      
      if (error) {
        r.classList.add("error");
        r.classList.remove("has-copy");
      } else {
        r.classList.remove("error");
        if(textToCopy) r.classList.add("has-copy");
      }
    }
  }

  document.addEventListener('click', e => {
    const r = e.target.closest('.result.has-copy');
    if (r && !r.classList.contains('error') && textToCopy) {
      navigator.clipboard.writeText(textToCopy).then(() => {
        r.classList.add('copied');
        setTimeout(() => r.classList.remove('copied'), 2000);
      }).catch(()=>{}); // Evita erro se o navegador bloquear (ex: sem HTTPS local)
    }
  });

  // Ferramentas 
  function renderDate() {
    $("#title").textContent = "Calculadora de Data";
    $("#subtitle").textContent = "Descubra exatamente quanto tempo existe entre duas datas.";
    tool.innerHTML = `
      <div class="tabs">
        <button class="tab ${dateMode === "diff" ? "active" : ""}" data-mode="diff">Diferença</button>
        <button class="tab ${dateMode === "add" ? "active" : ""}" data-mode="add">Adicionar</button>
        <button class="tab ${dateMode === "sub" ? "active" : ""}" data-mode="sub">Subtrair</button>
      </div>
      <div id="dateArea"></div>`;
    renderDateArea();
  }

  function renderDateArea() {
    const area = $("#dateArea");
    if (dateMode === "diff") {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label>DATA INICIAL</label><input type="date" id="date1"></div>
          <div class="field"><label>DATA FINAL</label><input type="date" id="date2"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      $("#date1").value = getModeVal('diff', 'd1', getLocalISODate());
      $("#date2").value = getModeVal('diff', 'd2', getLocalISODate());
      
      const calculate = () => {
        const d1v = $("#date1").value, d2v = $("#date2").value;
        setURLParams({ mode: 'diff', d1: d1v, d2: d2v });
        const a = dateFromInput("#date1"), b = dateFromInput("#date2");
        if(!a || !b) return showResult("Selecione as duas datas.", "", true);
        const x = calendarDifference(a, b);
        const html = `<div class="big">${x.y} ${x.y===1?"ano":"anos"}, ${x.m} ${x.m===1?"mês":"meses"} e ${x.d} ${x.d===1?"dia":"dias"}</div><div class="small">Total: ${x.total.toLocaleString("pt-BR")} ${x.total===1?"dia":"dias"}</div>`;
        const plainText = `Diferença entre datas: ${x.y} anos, ${x.m} meses e ${x.d} dias (Total de ${x.total} dias). Calculado em tempo.`;
        showResult(html, plainText);
      };
      
      $("#date1").oninput = calculate; $("#date2").oninput = calculate; calculate();
    } else {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label>DATA</label><input type="date" id="baseDate"></div>
          <div class="field"><label>QUANTIDADE DE DIAS</label><input type="number" id="days" min="0" step="1" placeholder="Ex.: 45"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      $("#baseDate").value = getModeVal(dateMode, 'base', getLocalISODate());
      $("#days").value = getModeVal(dateMode, 'days', '30');
      
      const calculate = () => {
        const bv = $("#baseDate").value, dv = $("#days").value;
        setURLParams({ mode: dateMode, base: bv, days: dv });
        const base = dateFromInput("#baseDate"), n = Number(dv);
        if(!base || dv === "" || !Number.isInteger(n) || n < 0) return showResult("Informe uma data e uma quantidade.", "", true);
        const d = new Date(base);
        d.setDate(d.getDate() + (dateMode === "add" ? n : -n));
        const html = `<div class="big">${formatDate(d)}</div><div class="small">${dateMode==="add"?"Foram adicionados":"Foram subtraídos"} ${n.toLocaleString("pt-BR")} ${n===1?"dia":"dias"} de ${formatDate(base)}.</div>`;
        const plainText = `Resultado: ${formatDate(d)} (${dateMode==="add"?"Adicionados":"Subtraídos"} ${n} dias de ${formatDate(base)}). Calculado em tempo.`;
        showResult(html, plainText);
      };
      
      $("#baseDate").oninput = calculate; $("#days").oninput = calculate; calculate();
    }
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => { dateMode = b.dataset.mode; renderDate() });
  }

  function renderTime() {
    $("#title").textContent = "Calculadora de Horas";
    $("#subtitle").textContent = "Calcule a diferença entre dois horários.";
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label>HORÁRIO INICIAL</label><input type="time" id="time1"></div>
        <div class="field"><label>HORÁRIO FINAL</label><input type="time" id="time2"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    $("#time1").value = getVal('t1', '08:00');
    $("#time2").value = getVal('t2', '17:40');
    
    const calculate = () => {
      const a = $("#time1").value, b = $("#time2").value;
      setURLParams({ t1: a, t2: b });
      if(!a || !b) return showResult("Informe os dois horários.", "", true);
      let [ah, am] = a.split(":").map(Number), [bh, bm] = b.split(":").map(Number);
      let start = ah * 60 + am, end = bh * 60 + bm;
      if(end < start) end += 1440;
      const total = end - start, h = Math.floor(total / 60), m = total % 60;
      const html = `<div class="big">${h}h ${m.toString().padStart(2, "0")}min</div><div class="small">Total: ${total.toLocaleString("pt-BR")} minutos</div>`;
      const plainText = `Diferença de horário: ${h}h ${m.toString().padStart(2, "0")}min (Total: ${total} minutos). Calculado em tempo.`;
      showResult(html, plainText);
    };
    
    $("#time1").oninput = calculate; $("#time2").oninput = calculate; calculate();
  }

  function renderBusiness() {
    $("#title").textContent = "Calculadora de Dias Úteis";
    $("#subtitle").textContent = "Calcule prazos desconsiderando os finais de semana.";
    tool.innerHTML = `
      <div class="tabs">
        <button class="tab ${businessMode === "diff" ? "active" : ""}" data-mode="diff">Diferença</button>
        <button class="tab ${businessMode === "add" ? "active" : ""}" data-mode="add">Adicionar</button>
        <button class="tab ${businessMode === "sub" ? "active" : ""}" data-mode="sub">Subtrair</button>
      </div>
      <div id="businessArea"></div>`;
    renderBusinessArea();
  }

  function renderBusinessArea() {
    const area = $("#businessArea");
    if (businessMode === "diff") {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label>DATA INICIAL</label><input type="date" id="bDate1"></div>
          <div class="field"><label>DATA FINAL</label><input type="date" id="bDate2"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      const d2 = new Date(); d2.setDate(d2.getDate() + 15);
      $("#bDate1").value = getModeVal('diff', 'd1', getLocalISODate()); 
      $("#bDate2").value = getModeVal('diff', 'd2', getLocalISODate(d2));
      
      const calculate = () => {
        const v1 = $("#bDate1").value, v2 = $("#bDate2").value;
        setURLParams({ mode: 'diff', d1: v1, d2: v2 });
        const a = dateFromInput("#bDate1"), b = dateFromInput("#bDate2");
        if(!a || !b) return showResult("Selecione as duas datas.", "", true);
        const total = businessDaysDifference(a, b);
        const html = `<div class="big">${total.toLocaleString("pt-BR")} ${total===1?"dia útil":"dias úteis"}</div><div class="small">Intervalo desconsiderando sábados e domingos.</div>`;
        const plainText = `Dias Úteis: Existem ${total} dias úteis entre ${formatDate(a)} e ${formatDate(b)}. Calculado em tempo.`;
        showResult(html, plainText);
      };
      
      $("#bDate1").oninput = calculate; $("#bDate2").oninput = calculate; calculate();
    } else {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label>DATA</label><input type="date" id="bBaseDate"></div>
          <div class="field"><label>DIAS ÚTEIS</label><input type="number" id="bDays" min="0" step="1" placeholder="Ex.: 10"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      $("#bBaseDate").value = getModeVal(businessMode, 'base', getLocalISODate());
      $("#bDays").value = getModeVal(businessMode, 'days', '10');
      
      const calculate = () => {
        const bv = $("#bBaseDate").value, dv = $("#bDays").value;
        setURLParams({ mode: businessMode, base: bv, days: dv });
        const base = dateFromInput("#bBaseDate"), n = Number(dv);
        if(!base || dv === "" || !Number.isInteger(n) || n < 0) return showResult("Informe uma data e quantidade.", "", true);
        const d = addBusinessDays(base, n, businessMode === "add");
        const html = `<div class="big">${formatDate(d)}</div><div class="small">${businessMode==="add"?"Data após adicionar":"Data após subtrair"} ${n.toLocaleString("pt-BR")} ${n===1?"dia útil":"dias úteis"}.</div>`;
        const plainText = `Resultado: ${formatDate(d)} (${businessMode==="add"?"Adicionados":"Subtraídos"} ${n} dias úteis de ${formatDate(base)}). Calculado em tempo.`;
        showResult(html, plainText);
      };
      
      $("#bBaseDate").oninput = calculate; $("#bDays").oninput = calculate; calculate();
    }
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => { businessMode = b.dataset.mode; renderBusiness() });
  }

  function renderAge() {
    $("#title").textContent = "Calculadora de Idade Exata";
    $("#subtitle").textContent = "Descubra sua idade em anos, meses e dias.";
    tool.innerHTML = `
    <div class="grid">
        <div class="field"><label>DATA DE NASCIMENTO</label><input type="date" id="birthDate"></div>
        <div class="field"><label>DATA DE REFERÊNCIA</label><input type="date" id="refDate"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    $("#birthDate").value = getVal('birth', '2000-01-01');
    $("#refDate").value = getVal('ref', getLocalISODate());
    
    const calculate = () => {
      const bv = $("#birthDate").value, rv = $("#refDate").value;
      setURLParams({ birth: bv, ref: rv });
      const birth = dateFromInput("#birthDate"), ref = dateFromInput("#refDate");
      if(!birth || !ref) return showResult("Selecione as datas corretamente.", "", true);
      if(birth > ref) return showResult("A data de nascimento não pode ser futura.", "", true);
      const x = calendarDifference(birth, ref);
      const html = `<div class="big">${x.y} anos, ${x.m} meses e ${x.d} dias</div><div class="small">Total aproximado de ${x.total.toLocaleString("pt-BR")} dias vividos.</div>`;
      const plainText = `Idade Exata: ${x.y} anos, ${x.m} meses e ${x.d} dias (Aproximadamente ${x.total} dias vividos). Calculado em tempo.`;
      showResult(html, plainText);
    };
    
    $("#birthDate").oninput = calculate; $("#refDate").oninput = calculate; calculate();
  }

  function renderPregnancy() {
    $("#title").textContent = "Calculadora de Gestação";
    $("#subtitle").textContent = "Estime a idade gestacional e a data provável do parto.";
    tool.innerHTML = `
      <div class="grid" style="grid-template-columns:1fr">
        <div class="field"><label>DATA DA ÚLTIMA MENSTRUAÇÃO (DUM)</label><input type="date" id="dumDate"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    const past = new Date(); past.setDate(past.getDate() - 84); // Ex: 12 semanas
    $("#dumDate").value = getVal('dum', getLocalISODate(past));
    
    const calculate = () => {
      const dv = $("#dumDate").value;
      setURLParams({ dum: dv });
      const dum = dateFromInput("#dumDate");
      if(!dum) return showResult("Informe a data da última menstruação.", "", true);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      if(dum > today) return showResult("A DUM não pode ser uma data futura.", "", true);
      
      const diffDays = Math.floor((today - dum) / 86400000);
      const weeks = Math.floor(diffDays / 7);
      const days = diffDays % 7;
      const dueDate = new Date(dum); dueDate.setDate(dueDate.getDate() + 280); 
      
      const html = `<div class="big">${weeks} semanas e ${days} dias</div><div class="small">Previsão do parto: <strong>${formatDate(dueDate)}</strong> (40 semanas).</div>`;
      const plainText = `Gestação: ${weeks} semanas e ${days} dias. Previsão do parto: ${formatDate(dueDate)}. Calculado em tempo.`;
      showResult(html, plainText);
    };
    
    $("#dumDate").oninput = calculate; calculate();
  }

  // Controle do Menu e Inicialização
  function loadTool(t) {
    activeTool = t;
    saveTool(t); // Salva na memória do navegador
    
    document.querySelectorAll(".menu-item").forEach(x => x.classList.remove("active"));
    const activeItem = document.querySelector(`.menu-item[data-tool="${t}"]`);
    if (activeItem) activeItem.classList.add("active");

    if (t === "date") renderDate();
    else if (t === "time") renderTime();
    else if (t === "business") renderBusiness();
    else if (t === "age") renderAge();
    else if (t === "pregnancy") renderPregnancy();
  }

  openMenuBtn.onclick = () => { drawer.classList.add("open"); closeMenuBtn.focus(); };
  closeMenuBtn.onclick = () => { drawer.classList.remove("open"); openMenuBtn.focus(); };
  drawer.onclick = (e) => { if (e.target === drawer) { drawer.classList.remove("open"); openMenuBtn.focus(); } };

  document.querySelectorAll(".menu-item").forEach(item => {
    item.onclick = () => {
      drawer.classList.remove("open");
      openMenuBtn.focus();
      loadTool(item.dataset.tool); // Troca a ferramenta
    };
  });

  // Inicializa o app com a ferramenta correta
  loadTool(activeTool);
});
</script>
</body>
</html>
