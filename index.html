  const getLocalISODate = (d = new Date()) => {
    const adjusted = new Date(d);
    adjusted.setMinutes(adjusted.getMinutes() - adjusted.getTimezoneOffset());
    return adjusted.toISOString().slice(0, 10);
  };

  function dateFromInput(id) {
    const v = $(id).value;

  }

  function formatDate(d) {
    return d.toLocaleDateString(currentLang === 'en-US' ? 'en-US' : 'pt-BR', { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  function calendarDifference(start, end) {
    if (start > end) { let temp = start; start = end; end = temp; }
    let y = end.getFullYear() - start.getFullYear();
    let m = end.getMonth() - start.getMonth();
    let d = end.getDate() - start.getDate();
    if (d < 0) {
      m--;
      const previousMonth = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
      d += previousMonth;
    }
    if (m < 0) { y--; m += 12; }
    const utcStart = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
    const utcEnd = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());
    const total = Math.round((utcEnd - utcStart) / 86400000);
    return { y, m, d, total };
  }

  function businessDaysDifference(start, end) {
    if (start > end) { let temp = start; start = end; end = temp; }
    let count = 0; let cur = new Date(start);
    while (cur <= end) {
      const day = cur.getDay();
      if (day !== 0 && day !== 6) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return count;
  }

  function addBusinessDays(base, n, isAdd = true) {
    let cur = new Date(base); let added = 0; const dir = isAdd ? 1 : -1;
    while (added < n) {
      cur.setDate(cur.getDate() + dir);
      const day = cur.getDay();
      if (day !== 0 && day !== 6) added++;
    }
    return cur;
  }

  function showResult(html, plainText = "", error = false) {
    const r = $("#result");
    if(r) {
      textToCopy = plainText;
      r.innerHTML = html;
      r.classList.remove("show", "copied");
      void r.offsetWidth; 
      r.classList.add("show");
      
      if (error) {
        r.classList.add("error");
        r.classList.remove("has-copy");
      } else {
        r.classList.remove("error");
        if(textToCopy) r.classList.add("has-copy");
      }
    }
  }

  document.addEventListener('click', e => {
    const r = e.target.closest('.result.has-copy');
    if (r && !r.classList.contains('error') && textToCopy) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          r.classList.add('copied');
          setTimeout(() => r.classList.remove('copied'), 2000);
        }).catch(()=>{}); 
      } else {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = textToCopy;
          textArea.style.position = "fixed"; 
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          r.classList.add('copied');
          setTimeout(() => r.classList.remove('copied'), 2000);
        } catch(err) {}
      }
    }
  });

      showResult(html, `Total Horas Extras: R$ ${total.toFixed(2)}`);
    };
    $("#sal").oninput = calculate; $("#jor").oninput = calculate; $("#qtd").oninput = calculate; $("#rate").onchange = calculate; calculate();
  }

  function renderVacation13() {
    tool.innerHTML = `
      <div class="tabs">
        <button class="tab ${vacationMode === "13" ? "active" : ""}" data-mode="13">13º Salário</button>
        <button class="tab ${vacationMode === "vacation" ? "active" : ""}" data-mode="vacation">${currentLang === 'en-US' ? 'Vacation + 1/3' : 'Férias + 1/3'}</button>
      </div>
      <div id="vArea"></div>`;
    renderVArea();
  }

  function renderVArea() {
    const area = $("#vArea");
    if(vacationMode === "13"){
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="vSal">${currentLang === 'en-US' ? 'GROSS SALARY' : 'SALÁRIO BRUTO'} (R$)</label><input type="number" id="vSal" step="0.01" min="0" value="1621"></div>
          <div class="field"><label for="vMeses">${currentLang === 'en-US' ? 'MONTHS WORKED (1-12)' : 'MESES TRABALHADOS (1 a 12)'}</label><input type="number" id="vMeses" min="1" max="12" value="12"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      const calculate = () => {
        const sal = Number($("#vSal").value), meses = Number($("#vMeses").value);
        if(!sal || sal<=0 || !meses || meses<1 || meses>12) return showResult(currentLang === 'en-US' ? 'Invalid values.' : 'Valores inválidos.', "", true);
        const val = (sal / 12) * meses;
        const html = `
          <div class="big">R$ ${val.toLocaleString(currentLang,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
          <div class="small">${currentLang==='en-US'?'Proportional to':'Proporcional a'} ${meses} ${meses===1?'mês':'meses'}.</div>
          <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">${i18n[currentLang].disclaimer}</div>
        `;
        showResult(html, `13º Proporcional: R$ ${val.toFixed(2)}`);
      };
      $("#vSal").oninput = calculate; $("#vMeses").oninput = calculate; calculate();
    } else {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="vSal">${currentLang === 'en-US' ? 'GROSS SALARY' : 'SALÁRIO BRUTO'} (R$)</label><input type="number" id="vSal" step="0.01" min="0" value="1621"></div>
          <div class="field"><label for="vMeses">${currentLang === 'en-US' ? 'PERIOD MONTHS (1-12)' : 'MESES NO PERÍODO (1 a 12)'}</label><input type="number" id="vMeses" min="1" max="12" value="12"></div>
        </div>
        <div class="result" id="result"></div>`;
        
      const calculate = () => {
        const sal = Number($("#vSal").value), meses = Number($("#vMeses").value);
        if(!sal || sal<=0 || !meses || meses<1 || meses>12) return showResult(currentLang === 'en-US' ? 'Invalid values.' : 'Valores inválidos.', "", true);
        const base = (sal / 12) * meses, terço = base / 3, total = base + terço;
        const html = `
          <div class="big">R$ ${total.toLocaleString(currentLang,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
          <div class="small">${currentLang==='en-US'?'Vacation:':'Férias:'} R$ ${base.toFixed(2)} | 1/3: R$ ${terço.toFixed(2)}</div>
          <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">${i18n[currentLang].disclaimer}</div>
        `;
        showResult(html, `Férias + 1/3: R$ ${total.toFixed(2)}`);
      };
      $("#vSal").oninput = calculate; $("#vMeses").oninput = calculate; calculate();
    }
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => { vacationMode = b.dataset.mode; renderVacation13(); });
  }

  function renderRescision() {
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label for="rSal">${currentLang === 'en-US' ? 'GROSS SALARY' : 'SALÁRIO BRUTO'} (R$)</label><input type="number" id="rSal" step="0.01" min="0" value="2500"></div>
        <div class="field"><label for="rReason">${currentLang === 'en-US' ? 'TERMINATION REASON' : 'MOTIVO DA SAÍDA'}</label>
          <select id="rReason">
            <option value="sem_justa">${currentLang === 'en-US' ? 'Without cause' : 'Dispensa sem justa causa'}</option>
            <option value="pedido">${currentLang === 'en-US' ? 'Resignation' : 'Pedido de demissão'}</option>
            <option value="acordo">${currentLang === 'en-US' ? 'Mutual agreement' : 'Acordo comum'}</option>
          </select>
        </div>
      </div>
      <div class="grid" style="margin-top:14px">
        <div class="field"><label for="rAdm">${currentLang === 'en-US' ? 'HIRE DATE' : 'DATA DE ADMISSÃO'}</label><input type="date" id="rAdm"></div>
        <div class="field"><label for="rTerm">${currentLang === 'en-US' ? 'TERMINATION DATE' : 'DATA DE DEMISSÃO'}</label><input type="date" id="rTerm"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    const today = new Date();
    const adm = new Date(); adm.setFullYear(adm.getFullYear() - 2);
    $("#rAdm").value = getLocalISODate(adm);
    $("#rTerm").value = getLocalISODate(today);
    
    const calculate = () => {
      const sal = Number($("#rSal").value), reason = $("#rReason").value, dAdm = dateFromInput("#rAdm"), dTerm = dateFromInput("#rTerm");
      if(!sal || sal<=0 || !dAdm || !dTerm) return showResult(currentLang === 'en-US' ? 'Fill all fields.' : 'Preencha todos os campos.', "", true);
      if(dAdm > dTerm) return showResult(currentLang === 'en-US' ? 'Hire date cannot be after termination.' : 'Admissão posterior à demissão.', "", true);
      
      const timeDiff = calendarDifference(dAdm, dTerm), totalMonths = timeDiff.y * 12 + timeDiff.m;
      const saldoSalario = (sal / 30) * dTerm.getDate();
      const decimoTerceiro = (sal / 12) * (dTerm.getMonth() + 1);
      const feriasBase = (sal / 12) * (totalMonths % 12 || 12), feriasTotal = feriasBase + (feriasBase / 3);
      
      let avisoPrevio = 0;
      if (reason === "sem_justa") avisoPrevio = (sal / 30) * (30 + Math.min(timeDiff.y * 3, 60));
      else if (reason === "acordo") avisoPrevio = ((sal / 30) * (30 + Math.min(timeDiff.y * 3, 60))) / 2;
      
      let multaFgts = reason === "sem_justa" ? ((sal * 0.08) * totalMonths) * 0.40 : (reason === "acordo" ? ((sal * 0.08) * totalMonths) * 0.20 : 0);
      const totalRescisao = saldoSalario + decimoTerceiro + feriasTotal + avisoPrevio + multaFgts;
      
      const html = `
        <div class="big">R$ ${totalRescisao.toLocaleString(currentLang,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="small" style="margin-top:8px; line-height:1.6;">
          Saldo: R$ ${saldoSalario.toFixed(2)}<br>
          ${reason !== 'pedido' ? `Aviso Prévio: R$ ${avisoPrevio.toFixed(2)}<br>` : ''}
          13º: R$ ${decimoTerceiro.toFixed(2)} | Férias: R$ ${feriasTotal.toFixed(2)}
        </div>
        <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">${i18n[currentLang].disclaimer}</div>
      `;
      showResult(html, `Rescisão estimada: R$ ${totalRescisao.toFixed(2)}`);
    };
    $("#rSal").oninput = calculate; $("#rReason").onchange = calculate; $("#rAdm").oninput = calculate; $("#rTerm").oninput = calculate; calculate();
  }

  function renderRunning() {
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label for="runDist">${currentLang === 'en-US' ? 'DISTANCE (KM)' : 'DISTÂNCIA (KM)'}</label><input type="number" id="runDist" step="0.5" min="1" value="10"></div>
        <div class="field"><label for="runTime">${currentLang === 'en-US' ? 'TARGET TIME (MINUTES)' : 'TEMPO DESEJADO (MINUTOS)'}</label><input type="number" id="runTime" min="1" value="50"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    const calculate = () => {
      const dist = Number($("#runDist").value), totalMin = Number($("#runTime").value);
      if(!dist || dist <= 0 || !totalMin || totalMin <= 0) return showResult(currentLang === 'en-US' ? 'Invalid values.' : 'Valores inválidos.', "", true);
      
      const paceDec = totalMin / dist, paceMin = Math.floor(paceDec), paceSec = Math.round((paceDec - paceMin) * 60);
      const paceFormatted = `${paceMin}:${paceSec < 10 ? '0' : ''}${paceSec}`, speed = (dist / (totalMin / 60)).toFixed(1);
      
      const html = `
        <div class="big">${paceFormatted} <span style="font-size:16px; font-weight:normal; color:var(--muted);">min/km</span></div>
        <div class="small" style="margin-top:8px;">${currentLang==='en-US'?'Average Speed:':'Velocidade Média:'} <strong>${speed} km/h</strong></div>
      `;
      showResult(html, `Ritmo: ${paceFormatted} min/km (${speed} km/h)`);
    };
    $("#runDist").oninput = calculate; $("#runTime").oninput = calculate; calculate();
  }

  // --- COMMAND PALETTE (CTRL+K) ---
  function openPalette() {
    paletteModal.classList.add("open");
    paletteInput.value = "";
    renderPaletteList("");
    setTimeout(() => paletteInput.focus(), 50);
  }
  function closePalette() { paletteModal.classList.remove("open"); }

  function renderPaletteList(query) {
    const list = Object.keys(i18n[currentLang].tools).map(key => ({
      key, name: i18n[currentLang].tools[key].menuName, badge: i18n[currentLang].tools[key].badge
    })).filter(x => x.name.toLowerCase().includes(query.toLowerCase()));

    paletteList.innerHTML = list.map((item, idx) => `
      <button class="palette-item ${idx===0?'selected':''}" data-tool="${item.key}">
        <span>${item.name}</span>
        <span style="font-size:11px; color:var(--muted); font-weight:600; border:1px solid var(--line); padding:2px 6px; border-radius:6px;">${item.badge}</span>
      </button>
    `).join('');

    paletteList.querySelectorAll('.palette-item').forEach(btn => {
      btn.onclick = () => {
        loadTool(btn.dataset.tool);
        closePalette();
      };
    });
  }

  paletteInput.oninput = (e) => renderPaletteList(e.target.value);
  searchBtn.onclick = openPalette;
  paletteModal.onclick = (e) => { if(e.target === paletteModal) closePalette(); };

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (paletteModal.classList.contains('open')) closePalette();
      else openPalette();
    }
    if (e.key === 'Escape') closePalette();
  });

  // --- INTERFACE & MENU UPDATES ---
  function updateStaticTexts() {
    footerText.innerHTML = i18n[currentLang].footer;
    menuTitle.textContent = i18n[currentLang].menu;
    langLabel.textContent = i18n[currentLang].langLabel;
    groupEssential.textContent = i18n[currentLang].g1;
    groupPersonal.textContent = i18n[currentLang].g2;
    groupLabor.textContent = i18n[currentLang].g3;
    groupSport.textContent = i18n[currentLang].g4;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const k = el.getAttribute("data-i18n");
      const toolKey = k.replace("tool_", "");
      if (i18n[currentLang].tools[toolKey]) {
        el.textContent = i18n[currentLang].tools[toolKey].menuName;
      }
    });
  }

  function loadTool(t) {
    if (window._wcInterval) clearInterval(window._wcInterval);
    activeTool = t;
    saveTool(t); 
    
    const meta = i18n[currentLang].tools[t] || i18n[currentLang].tools['date'];
    pageTitle.textContent = "tempo. — " + meta.title;
    titleEl.textContent = meta.title;
    subtitleEl.textContent = meta.subtitle;
    toolBadge.textContent = meta.badge;
    
    document.querySelectorAll(".menu-item").forEach(x => x.classList.remove("active"));
    const activeItem = document.querySelector(`.menu-item[data-tool="${t}"]`);
    if (activeItem) activeItem.classList.add("active");

    if (t === "date") renderDate();
    else if (t === "time") renderTime();
    else if (t === "business") renderBusiness();
    else if (t === "worldclock") renderWorldClock();
    else if (t === "age") renderAge();
    else if (t === "pregnancy") renderPregnancy();
    else if (t === "countdown") renderCountdown();
    else if (t === "overtime") renderOvertime();
    else if (t === "vacation13") renderVacation13();
    else if (t === "rescision") renderRescision();
    else if (t === "running") renderRunning();
  }

  langSelect.onchange = (e) => {
    currentLang = e.target.value;
    try { localStorage.setItem('tempo_lang', currentLang); } catch(err) {}
    updateStaticTexts();
    loadTool(activeTool);
  };

  logoBtn.addEventListener('click', () => { drawer.classList.remove("open"); loadTool('date'); });
  openMenuBtn.addEventListener('click', () => drawer.classList.add("open"));
  closeMenuBtn.addEventListener('click', () => drawer.classList.remove("open"));
  drawer.addEventListener('click', (e) => { if (e.target === drawer) drawer.classList.remove("open"); });

  document.querySelectorAll(".menu-item").forEach(item => {
    item.addEventListener('click', () => {
      drawer.classList.remove("open");
      loadTool(item.dataset.tool);
    });
  });

  updateStaticTexts();
  loadTool(activeTool);
});
</script>
</body>
</html>
