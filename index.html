<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

:root.light{

button,input,select{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}
.app{width:min(100%,1180px);margin:auto;padding:0 20px 48px}
header{height:76px;display:flex;align-items:center;justify-content:space-between}

.logo{font-size:21px;font-weight:850;letter-spacing:-.7px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:opacity .2s, transform .15s ease}
.logo:hover{opacity:0.75}

.logo span{color:var(--accent)}

.header-actions{display:flex;gap:10px;align-items:center}
.icon-btn{width:45px;height:45px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);display:grid;place-items:center;transition:transform .15s ease, background .2s, border-color .2s;outline:none}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.icon-btn:hover{transform:scale(1.04);background:var(--card2);border-color:var(--accent)}
.icon-btn:active{transform:scale(0.95)}

.hero{text-align:center;padding:48px 0 27px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.8px;margin-bottom:17px;background:var(--card)}
h1{font-size:clamp(37px,7vw,64px);line-height:1;letter-spacing:-2.8px;margin-bottom:15px}
.hero p{color:var(--muted);font-size:15px;line-height:1.6}
.panel{width:min(100%,760px);margin:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:23px;box-shadow:0 25px 80px rgba(0,0,0,.15);overflow:hidden}

.tabs{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin-bottom:23px;border:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:11px 8px;border-radius:10px;font-weight:750;font-size:13px;transition:.2s}
.tab.active{background:var(--card2);color:var(--text);box-shadow:0 3px 12px rgba(0,0,0,.1)}

.grid{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px}
.field{min-width:0}
.field label{display:block;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.5px;margin:0 0 8px 3px}

input,select{width:100%;max-width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:12px 14px;outline:none;transition:.2s;font-size:16px;-webkit-appearance:none}

.result{margin-top:20px;padding:21px;border:1px solid var(--line);background:var(--bg);border-radius:16px;text-align:center;display:none;transition:border-color 0.2s}
.result.show{display:block;animation:up .25s ease-out}
.result .big{font-size:clamp(22px,4.5vw,30px);font-weight:900;letter-spacing:-1px;word-break:break-word}
.result .small{color:var(--muted);margin-top:7px;font-size:13px;line-height:1.5}
.error{color:var(--danger)!important}
.result.has-copy{cursor:pointer;position:relative;padding-bottom:30px}
.result.has-copy::after{content:'Clique no card para copiar';position:absolute;bottom:10px;left:0;right:0;font-size:11px;font-weight:750;color:var(--muted);opacity:0.6;transition:0.2s}
.result.has-copy:hover::after{opacity:1;color:var(--accent)}
.result.has-copy.copied{border-color:#4ade80}
.result.has-copy.copied::after{content:'✓ Copiado!';color:#4ade80;opacity:1}

/* Command Palette Modal */
.palette-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.2s;z-index:100;display:grid;place-items:center;padding:20px}
.palette-overlay.open{opacity:1;pointer-events:auto}
.palette-box{width:min(100%, 520px);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 25px 60px rgba(0,0,0,.3);transform:translateY(-10px);transition:.2s}
.palette-overlay.open .palette-box{transform:translateY(0)}
.palette-input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:14px;border-radius:12px;font-size:16px;outline:none;margin-bottom:12px}
.palette-list{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.palette-item{padding:12px 14px;border-radius:10px;background:transparent;border:0;color:var(--text);text-align:left;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:.15s}
.palette-item:hover, .palette-item.selected{background:var(--card2);color:var(--accent)}

/* Drawer Menu */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s;z-index:90}

.drawer-card{position:absolute;right:0;top:0;height:100%;width:min(350px,89vw);background:var(--card);border-left:1px solid var(--line);padding:22px;transform:translateX(100%);transition:.3s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.drawer.open .drawer-card{transform:translateX(0)}

.drawer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:18px}
.close{border:0;background:var(--card2);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:21px}
.lang-selector{margin-bottom:20px}
.lang-selector select{padding:10px;font-size:16px;font-weight:700}
.menu-group{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.8px;margin:18px 0 8px 4px}
.menu-item{width:100%;text-align:left;padding:12px 16px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;margin-bottom:8px;font-weight:750;font-size:14px;transition:.2s;display:flex;align-items:center;gap:12px}
.menu-item svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}
.menu-item:hover,.menu-item.active{border-color:var(--accent);background:var(--card2)}
.menu-item span{opacity:.9}

footer{text-align:center;color:var(--muted);font-size:11px;margin-top:42px}
footer a{color:var(--muted);text-decoration:none;transition:.2s}
footer a:hover{color:var(--accent)}
@keyframes up{from{opacity:0;transform:translateY(8px) scale(0.98)}to{opacity:1;transform:none}}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
@media(max-width:600px){.app{padding:0 14px 35px}.hero{padding:38px 0 22px}.panel{padding:17px;border-radius:20px}h1{letter-spacing:-2px}.tabs{margin-bottom:19px}.tab{font-size:12px}}
</style>

  function calendarDifference(start, end) {
    if (start > end) { let temp = start; start = end; end = temp; }
    let y = end.getFullYear() - start.getFullYear();
    let m = end.getMonth() - start.getMonth();
    let d = end.getDate() - start.getDate();
    
    if (m < 0 || (m === 0 && d < 0)) {
      y--;
      m += 12;
    }
    
    if (d < 0) {
      m--;
      if (m < 0) { m += 12; y--; }
      let daysInPrevMonth = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
      d += daysInPrevMonth;
      if (d < 0) { d = end.getDate(); }
    }
    
    const utcStart = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
    const utcEnd = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());
    const total = Math.round((utcEnd - utcStart) / 86400000);
    return { y, m, d, total };
  }

  // ALGORITMO OTIMIZADO DE DIAS ÚTEIS - O(1)
  function businessDaysDifference(start, end) {
    if (start > end) { let temp = start; start = end; end = temp; }
    let s = new Date(start); s.setDate(s.getDate() + 1);
    let e = new Date(end);
    s.setHours(12,0,0,0); e.setHours(12,0,0,0);
    if (s > e) return 0;
    
    let totalDays = Math.round((e - s) / 86400000) + 1;
    let fullWeeks = Math.floor(totalDays / 7);
    let remDays = totalDays % 7;
    
    let count = fullWeeks * 5;
    let curDayOfWeek = s.getDay();
    for (let i = 0; i < remDays; i++) {
      let d = (curDayOfWeek + i) % 7;
      if (d !== 0 && d !== 6) count++;
    }
    return count;
  }

  function addBusinessDays(base, n, isAdd = true) {
    let cur = new Date(base); 
    cur.setHours(12, 0, 0, 0);
    if (n === 0) return cur;
    let dir = isAdd ? 1 : -1;
    
    let fullWeeks = Math.floor(n / 5);
    let rem = n % 5;
    
    cur.setDate(cur.getDate() + (fullWeeks * 7 * dir));
    let added = fullWeeks * 5;
    
    while (added < n) {
      cur.setDate(cur.getDate() + dir);
      const day = cur.getDay();
      if (day !== 0 && day !== 6) added++;
    }
    return cur;
  }

    const r = $("#result");

      textToCopy = plainText;
      r.innerHTML = html;
      r.classList.remove("show", "copied");
      void r.offsetWidth; 
      r.classList.add("show");
      
      if (error) {
        r.classList.add("error");
        r.classList.remove("has-copy");
      } else {
        r.classList.remove("error");
        if(textToCopy) r.classList.add("has-copy");
      }
    }
  }

  document.addEventListener('click', e => {
    const r = e.target.closest('.result.has-copy');
    if (r && !r.classList.contains('error') && textToCopy) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          r.classList.add('copied');
          setTimeout(() => r.classList.remove('copied'), 2000);
        }).catch(()=>{}); 
      } else {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = textToCopy;
          textArea.style.position = "fixed"; 
          document.body.appendChild(textArea);
          textArea.focus();

      </div>`;
    
    const zones = [
      { city: 'Brasília', tz: 'America/Sao_Paulo' },
      { city: 'Lisboa', tz: 'Europe/Lisbon' },
      { city: 'New York', tz: 'America/New_York' },
      { city: 'London', tz: 'Europe/London' },
      { city: 'Tokyo', tz: 'Asia/Tokyo' }
    ];

    const grid = $("#worldClockGrid");
    $("#localTzBox").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

    grid.innerHTML = zones.map((z, idx) => `
      <div style="background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center;">
        <div style="font-size:11px; font-weight:750; color:var(--muted); margin-bottom:4px;">${z.city}</div>

    `).join('');

    function updateClocks() {
      if(!$("#worldClockGrid")) return;
      const now = new Date();
      zones.forEach((z, idx) => {
        const timeEl = $(`#wc-time-${idx}`);
        const dateEl = $(`#wc-date-${idx}`);
        if(timeEl && dateEl) {

          dateEl.textContent = new Intl.DateTimeFormat(currentLang, { timeZone: z.tz, weekday: 'short', day: 'numeric', month: 'short' }).format(now);

  // GERENCIAMENTO SEGURO DE ÁUDIO NO POMODORO
  let audioCtx = null;
  function playAlarm() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const notes = [587.33, 659.25, 783.99];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const startTime = audioCtx.currentTime + (idx * 0.3);
        const duration = 0.25;
        
        gain.gain.setValueAtTime(0.2, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        
        osc.start(startTime);
        osc.stop(startTime + duration);
      });
    } catch(e) {}
  }

      </div>`;

    function getSecondsForMode(m) {
      if (m === 'work') return 25 * 60;
      if (m === 'short') return 5 * 60;
      return 15 * 60;
    }

    const displayEl = $("#pomoDisplay");
    const toggleBtn = $("#pomoToggleBtn");
    const resetBtn = $("#pomoResetBtn");
    const statusEl = $("#pomoStatus");

    function updateDisplay() {
      const m = Math.floor(st.timeLeft / 60);
      const s = st.timeLeft % 60;
      displayEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
    updateDisplay();

    function stopTimer() {
      if (window._pomodoroInterval) {
        clearInterval(window._pomodoroInterval);
        window._pomodoroInterval = null;
      }
      st.running = false;
    }

    function startTimer(isResume = false) {
      if (!isResume) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        st.running = true;
      }

      toggleBtn.textContent = isEn ? 'Pause' : 'Pausar';
      statusEl.textContent = isEn ? 'Focus session in progress...' : 'Sessão em andamento...';

      if (window._pomodoroInterval) {
        clearInterval(window._pomodoroInterval);
      }

      window._pomodoroInterval = setInterval(() => {
        if (st.timeLeft > 0) {
          st.timeLeft--;
          updateDisplay();
        } else {
          stopTimer();
          toggleBtn.textContent = isEn ? 'Start' : 'Iniciar';
          statusEl.textContent = isEn ? 'Time is up! Great job.' : 'Tempo esgotado! Excelente trabalho.';
          playAlarm();
          try {
            if ('vibrate' in navigator) navigator.vibrate([300, 150, 300, 150, 400]);
          } catch(e){}
        }
      }, 1000);
    }

    // Mantém rodando em background e reconecta os novos elementos da tela perfeitamente ao retornar
    if (st.running) {
      startTimer(true);
    }

    toggleBtn.onclick = () => {
      if (st.running) {
        stopTimer();
        toggleBtn.textContent = isEn ? 'Start' : 'Iniciar';
        statusEl.textContent = isEn ? 'Paused.' : 'Pausado.';
      } else {
        startTimer(false);
      }
    };

    resetBtn.onclick = () => {
      stopTimer();
      st.timeLeft = getSecondsForMode(st.mode);
      updateDisplay();
      toggleBtn.textContent = isEn ? 'Start' : 'Iniciar';
      statusEl.textContent = isEn ? 'Timer reset.' : 'Cronômetro reiniciado.';
    };

    document.querySelectorAll("[data-pmode]").forEach(tab => {
      tab.onclick = () => {
        stopTimer();
        st.mode = tab.dataset.pmode;
        st.timeLeft = getSecondsForMode(st.mode);
        renderPomodoro();
      };
    });
  }

      <div class="grid" style="margin-top:14px">
        <div class="field"><label for="qtd">${isEn ? 'OVERTIME HOURS' : 'QTD. HORAS EXTRAS'}</label><input type="number" id="qtd" step="0.5" min="0" value="${st.qtd}"></div>
        <div class="field"><label for="rate">${isEn ? 'PREMIUM RATE' : 'ACRÉSCIMO LEGAL'}</label>
          <select id="rate">
            <option value="50" ${st.rate===50?'selected':''}>${label50}</option>
            <option value="100" ${st.rate===100?'selected':''}>${label100}</option>
          </select>
        </div>
      </div>
      <div class="result" id="result"></div>`;
      
    const calculate = () => {
      st.sal = Number($("#sal").value);
      st.jor = Number($("#jor").value);
      st.qtd = Number($("#qtd").value);
      st.rate = Number($("#rate").value);
      
      const sal = st.sal, jor = st.jor, qtd = st.qtd, rate = st.rate;
      if(!sal || sal<=0 || !jor || jor<=0 || isNaN(qtd) || qtd<0) return showResult(isEn ? 'Invalid values.' : 'Valores inválidos.', "", true);
      
      const vHora = sal / jor, vExtra = vHora * (1 + rate / 100), total = vExtra * qtd;
      const html = `
        <div class="big">R$ ${total.toLocaleString(currentLang,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="small">Normal: R$ ${vHora.toFixed(2)} | Extra (${rate}%): R$ ${vExtra.toFixed(2)}</div>
        <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">${i18n[currentLang].disclaimer}</div>
      `;
      showResult(html, `Total Horas Extras: R$ ${total.toFixed(2)}`);
    };
    $("#sal").oninput = calculate; $("#jor").oninput = calculate; $("#qtd").oninput = calculate; $("#rate").onchange = calculate; calculate();
  }

  function renderVacation13() {
    tool.innerHTML = `
      <div class="tabs">
        <button class="tab ${states.vacation13.mode === "13" ? "active" : ""}" data-mode="13">13º Salário</button>
        <button class="tab ${states.vacation13.mode === "vacation" ? "active" : ""}" data-mode="vacation">${currentLang === 'en-US' ? 'Vacation + 1/3' : 'Férias + 1/3'}</button>
      </div>
      <div id="vArea"></div>`;
    renderVArea();
  }

  function renderVArea() {
    const st = states.vacation13;
    const area = $("#vArea");
    if(st.mode === "13"){
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="vSal">${currentLang === 'en-US' ? 'GROSS SALARY' : 'SALÁRIO BRUTO'} (R$)</label><input type="number" id="vSal" step="0.01" min="0" value="${st.sal}"></div>
          <div class="field"><label for="vMeses">${currentLang === 'en-US' ? 'MONTHS WORKED (1-12)' : 'MESES TRABALHADOS (1 a 12)'}</label><input type="number" id="vMeses" min="1" max="12" value="${st.meses}"></div>
        </div>
        <div class="result" id="result"></div>`;
      
      const calculate = () => {
        st.sal = Number($("#vSal").value);
        st.meses = Number($("#vMeses").value);
        const sal = st.sal, meses = st.meses;
        if(!sal || sal<=0 || !meses || meses<1 || meses>12) return showResult(currentLang === 'en-US' ? 'Invalid values.' : 'Valores inválidos.', "", true);
        const val = (sal / 12) * meses;
        const html = `
          <div class="big">R$ ${val.toLocaleString(currentLang,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
          <div class="small">${currentLang==='en-US'?'Proportional to':'Proporcional a'} ${meses} ${meses===1?'mês':'meses'}.</div>
          <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">${i18n[currentLang].disclaimer}</div>
        `;
        showResult(html, `13º Proporcional: R$ ${val.toFixed(2)}`);
      };
      $("#vSal").oninput = calculate; $("#vMeses").oninput = calculate; calculate();
    } else {
      area.innerHTML = `
        <div class="grid">
          <div class="field"><label for="vSal">${currentLang === 'en-US' ? 'GROSS SALARY' : 'SALÁRIO BRUTO'} (R$)</label><input type="number" id="vSal" step="0.01" min="0" value="${st.sal}"></div>
          <div class="field"><label for="vMeses">${currentLang === 'en-US' ? 'PERIOD MONTHS (1-12)' : 'MESES NO PERÍODO (1 a 12)'}</label><input type="number" id="vMeses" min="1" max="12" value="${st.meses}"></div>
        </div>
        <div class="result" id="result"></div>`;
      
      const calculate = () => {
        st.sal = Number($("#vSal").value);
        st.meses = Number($("#vMeses").value);
        const sal = st.sal, meses = st.meses;
        if(!sal || sal<=0 || !meses || meses<1 || meses>12) return showResult(currentLang === 'en-US' ? 'Invalid values.' : 'Valores inválidos.', "", true);
        const base = (sal / 12) * meses, terço = base / 3, total = base + terço;
        const html = `
          <div class="big">R$ ${total.toLocaleString(currentLang,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
          <div class="small">${currentLang==='en-US'?'Vacation:':'Férias:'} R$ ${base.toFixed(2)} | 1/3: R$ ${terço.toFixed(2)}</div>
          <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">${i18n[currentLang].disclaimer}</div>
        `;
        showResult(html, `Férias + 1/3: R$ ${total.toFixed(2)}`);

      $("#vSal").oninput = calculate; $("#vMeses").oninput = calculate; calculate();
    }
    document.querySelectorAll(".tab").forEach(b => b.onclick = () => { st.mode = b.dataset.mode; renderVacation13(); });
  }

  function renderRescision() {
    const st = states.rescision;
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label for="rSal">${currentLang === 'en-US' ? 'GROSS SALARY' : 'SALÁRIO BRUTO'} (R$)</label><input type="number" id="rSal" step="0.01" min="0" value="${st.sal}"></div>
        <div class="field"><label for="rReason">${currentLang === 'en-US' ? 'TERMINATION REASON' : 'MOTIVO DA SAÍDA'}</label>
          <select id="rReason">
            <option value="sem_justa" ${st.reason==='sem_justa'?'selected':''}>${currentLang === 'en-US' ? 'Without cause' : 'Dispensa sem justa causa'}</option>
            <option value="pedido" ${st.reason==='pedido'?'selected':''}>${currentLang === 'en-US' ? 'Resignation' : 'Pedido de demissão'}</option>
            <option value="acordo" ${st.reason==='acordo'?'selected':''}>${currentLang === 'en-US' ? 'Mutual agreement' : 'Acordo comum (Art. 484-A)'}</option>
          </select>
        </div>
      </div>
      <div class="grid" style="margin-top:14px">
        <div class="field"><label for="rAdm">${currentLang === 'en-US' ? 'HIRE DATE' : 'DATA DE ADMISSÃO'}</label><input type="date" id="rAdm" value="${st.adm}"></div>
        <div class="field"><label for="rTerm">${currentLang === 'en-US' ? 'TERMINATION DATE' : 'DATA DE DEMISSÃO'}</label><input type="date" id="rTerm" value="${st.term}"></div>
      </div>
      <div class="result" id="result"></div>`;
    
    const calculate = () => {
      st.sal = Number($("#rSal").value);
      st.reason = $("#rReason").value;
      st.adm = $("#rAdm").value;
      st.term = $("#rTerm").value;

      const sal = st.sal, reason = st.reason, dAdm = dateFromInput("#rAdm"), dTerm = dateFromInput("#rTerm");
      if(!sal || sal<=0 || !dAdm || !dTerm) return showResult(currentLang === 'en-US' ? 'Fill all fields.' : 'Preencha todos os campos.', "", true);
      if(dAdm > dTerm) return showResult(currentLang === 'en-US' ? 'Hire date cannot be after termination.' : 'Admissão posterior à demissão.', "", true);
      
      const timeDiffReal = calendarDifference(dAdm, dTerm);
      
      let diasAviso = 0;
      if (reason === "sem_justa" || reason === "acordo") {
        diasAviso = 30 + Math.min(timeDiffReal.y * 3, 60);
      }

      const dProj = new Date(dTerm);
      if (reason !== "pedido") {
        dProj.setDate(dProj.getDate() + diasAviso);
      }

      const daysInMonth = new Date(dTerm.getFullYear(), dTerm.getMonth() + 1, 0).getDate();
      const diasTrab = Math.min(dTerm.getDate(), daysInMonth);
      const saldoSalario = diasTrab >= daysInMonth ? sal : Math.min(sal, (sal / 30) * diasTrab);
      
      let avisoPrevio = 0;
      if (reason === "sem_justa") {
        avisoPrevio = (sal / 30) * diasAviso;
      } else if (reason === "acordo") {
        avisoPrevio = ((sal / 30) * diasAviso) / 2;
      }

      const start13 = new Date(Math.max(dAdm.getTime(), new Date(dProj.getFullYear(), 0, 1).getTime()));
      const diff13 = calendarDifference(start13, dProj);
      let avos13 = diff13.y * 12 + diff13.m;
      if (diff13.d >= 15) avos13++;
      const decimoTerceiro = (sal / 12) * Math.min(avos13, 12);

      const totalMesesTrabalhados = timeDiffReal.y * 12 + timeDiffReal.m;
      let feriasTotal = 0;
      
      if (totalMesesTrabalhados >= 12) {
        const periodosVencidos = Math.floor(totalMesesTrabalhados / 12);
        const mesAtualCiclo = totalMesesTrabalhados % 12;
        let avosFeriasProp = mesAtualCiclo;
        if (timeDiffReal.d >= 15) avosFeriasProp++;
        
        const valorVencidas = (sal + sal / 3) * periodosVencidos;
        const valorProporcional = ((sal / 12) * Math.min(avosFeriasProp, 12)) * (4/3);
        feriasTotal = valorVencidas + valorProporcional;
      } else {
        const projDiff = calendarDifference(dAdm, dProj);
        let avosFerias = projDiff.m;
        if (projDiff.d >= 15) avosFerias++;
        const feriasBase = (sal / 12) * Math.min(avosFerias, 12);
        feriasTotal = feriasBase + (feriasBase / 3);
      }

      const totalMonthsReal = timeDiffReal.y * 12 + timeDiffReal.m + (timeDiffReal.d >= 15 ? 1 : 0);
      const saldoFgtsEst = (sal * 0.08) * totalMonthsReal;
      
      let multaFgts = 0;
      if (reason === "sem_justa") multaFgts = saldoFgtsEst * 0.40;
      else if (reason === "acordo") multaFgts = saldoFgtsEst * 0.20;

      const totalRescisao = saldoSalario + decimoTerceiro + feriasTotal + avisoPrevio + multaFgts;
      
      const html = `
        <div class="big">R$ ${totalRescisao.toLocaleString(currentLang,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="small" style="margin-top:8px; line-height:1.6;">
          Saldo: R$ ${saldoSalario.toFixed(2)} | 13º Prop.: R$ ${decimoTerceiro.toFixed(2)}<br>
          ${reason !== 'pedido' ? `Aviso Prévio (${diasAviso}d): R$ ${avisoPrevio.toFixed(2)}<br>` : ''}
          Férias (Venc./Prop. + ⅓): R$ ${feriasTotal.toFixed(2)}<br>
          ${reason !== 'pedido' ? `Multa FGTS: R$ ${multaFgts.toFixed(2)}` : ''}
        </div>
        <div class="small" style="margin-top:10px; opacity:0.75; font-size:11px;">${i18n[currentLang].disclaimer}</div>
      `;
      showResult(html, `Rescisão estimada: R$ ${totalRescisao.toFixed(2)}`);
    };
    $("#rSal").oninput = calculate; $("#rReason").onchange = calculate; $("#rAdm").oninput = calculate; $("#rTerm").oninput = calculate; calculate();
  }

  function renderRunning() {
    const st = states.running;
    tool.innerHTML = `
      <div class="grid">
        <div class="field"><label for="runDist">${currentLang === 'en-US' ? 'DISTANCE (KM)' : 'DISTÂNCIA (KM)'}</label><input type="number" id="runDist" step="0.5" min="1" value="${st.dist}"></div>
        <div class="field"><label for="runTime">${currentLang === 'en-US' ? 'TARGET TIME (MINUTES)' : 'TEMPO DESEJADO (MINUTOS)'}</label><input type="number" id="runTime" min="1" value="${st.time}"></div>
      </div>
      <div class="result" id="result"></div>`;
      
    const calculate = () => {
      st.dist = Number($("#runDist").value);
      st.time = Number($("#runTime").value);
      const dist = st.dist, totalMin = st.time;
      if(!dist || dist <= 0 || !totalMin || totalMin <= 0) return showResult(currentLang === 'en-US' ? 'Invalid values.' : 'Valores inválidos.', "", true);
      
      let paceDec = totalMin / dist, paceMin = Math.floor(paceDec), paceSec = Math.round((paceDec - paceMin) * 60);
      
      if (paceSec === 60) { paceMin += 1; paceSec = 0; }
      
      const paceFormatted = `${paceMin}:${paceSec < 10 ? '0' : ''}${paceSec}`, speed = (dist / (totalMin / 60)).toFixed(1);
      
      const html = `
        <div class="big">${paceFormatted} <span style="font-size:16px; font-weight:normal; color:var(--muted);">min/km</span></div>
        <div class="small" style="margin-top:8px;">${currentLang==='en-US'?'Average Speed:':'Velocidade Média:'} <strong>${speed} km/h</strong></div>
      `;
      showResult(html, `Ritmo: ${paceFormatted} min/km (${speed} km/h)`);
    };
    $("#runDist").oninput = calculate; $("#runTime").oninput = calculate; calculate();
  }

  function openPalette() {
    paletteModal.classList.add("open");
    paletteModal.setAttribute("aria-hidden", "false");
    paletteInput.value = "";
    renderPaletteList("");
    requestAnimationFrame(() => paletteInput.focus());
  }
  function closePalette() { 
    paletteModal.classList.remove("open"); 
    paletteModal.setAttribute("aria-hidden", "true");
    searchBtn.focus();
  }

  function openDrawer() {
    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    const firstMenuBtn = drawer.querySelector('.close');
    if(firstMenuBtn) firstMenuBtn.focus();
  }
  function closeDrawer() {
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    openMenuBtn.focus();
  }

  function renderPaletteList(query) {
    const list = Object.keys(i18n[currentLang].tools).map(key => ({
      key, name: i18n[currentLang].tools[key].menuName, badge: i18n[currentLang].tools[key].badge
    })).filter(x => x.name.toLowerCase().includes(query.toLowerCase()));

    paletteList.innerHTML = list.map((item, idx) => `
      <button class="palette-item ${idx===0?'selected':''}" data-tool="${item.key}">
        <span>${item.name}</span>
        <span style="font-size:11px; color:var(--muted); font-weight:600; border:1px solid var(--line); padding:2px 6px; border-radius:6px;">${item.badge}</span>
      </button>
    `).join('');

    paletteList.querySelectorAll('.palette-item').forEach(btn => {
      btn.onclick = () => {
        loadTool(btn.dataset.tool);
        closePalette();
      };
    });
  }

  paletteInput.oninput = (e) => renderPaletteList(e.target.value);
  searchBtn.onclick = openPalette;
  paletteModal.onclick = (e) => { if(e.target === paletteModal) closePalette(); };

  function trapFocus(e, container) {
    const focusable = container.querySelectorAll('input, button, select, textarea, a[href], [tabindex]:not([tabindex="-1"])');
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];

    if (e.key === 'Tab') {
      if (e.shiftKey) {
        if (document.activeElement === first) {
          last.focus();
          e.preventDefault();
        }
      } else {
        if (document.activeElement === last) {
          first.focus();
          e.preventDefault();
        }
      }
    }
  }

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (paletteModal.classList.contains('open')) closePalette();
      else openPalette();
    }
    if (e.key === 'Escape') {
      closePalette();
      closeDrawer();
    }
    if (paletteModal.classList.contains('open')) {
      trapFocus(e, paletteModal);
    } else if (drawer.classList.contains('open')) {
      trapFocus(e, drawer);
    }
  });

  function updateStaticTexts() {
    footerText.innerHTML = i18n[currentLang].footer;
    menuTitle.textContent = i18n[currentLang].menu;
    langLabel.textContent = i18n[currentLang].langLabel;
    groupEssential.textContent = i18n[currentLang].g1;
    groupPersonal.textContent = i18n[currentLang].g2;
    groupLabor.textContent = i18n[currentLang].g3;
    groupSport.textContent = i18n[currentLang].g4;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const k = el.getAttribute("data-i18n");
      const toolKey = k.replace("tool_", "");
      if (i18n[currentLang].tools[toolKey]) {
        el.textContent = i18n[currentLang].tools[toolKey].menuName;
      }
    });
  }

  function loadTool(t, updateHash = true) {
    if (window._wcInterval) {
      clearInterval(window._wcInterval);
      window._wcInterval = null;
    }

    activeTool = t;
    storage.set('tempo_tool', t); 
    
    if (updateHash && window.location.hash !== '#' + t) {
      window.location.hash = t;
    }

    const meta = i18n[currentLang].tools[t] || i18n[currentLang].tools['date'];
    pageTitle.textContent = "tempo. — " + meta.title;
    titleEl.textContent = meta.title;
    subtitleEl.textContent = meta.subtitle;
    toolBadge.textContent = meta.badge;
    
    document.querySelectorAll(".menu-item").forEach(x => x.classList.remove("active"));
    const activeItem = document.querySelector(`.menu-item[data-tool="${t}"]`);
    if (activeItem) activeItem.classList.add("active");

    if (t === "date") renderDate();
    else if (t === "time") renderTime();
    else if (t === "business") renderBusiness();
    else if (t === "worldclock") renderWorldClock();
    else if (t === "pomodoro") renderPomodoro();
    else if (t === "horoscope") renderHoroscope();
    else if (t === "age") renderAge();
    else if (t === "pregnancy") renderPregnancy();
    else if (t === "countdown") renderCountdown();
    else if (t === "overtime") renderOvertime();
    else if (t === "vacation13") renderVacation13();
    else if (t === "rescision") renderRescision();
    else if (t === "running") renderRunning();

    // GERENCIAMENTO DE FOCO E ACESSIBILIDADE: Foca o primeiro input ou elemento interativo
    requestAnimationFrame(() => {
      const firstEl = tool.querySelector('input, select, button');
      if (firstEl) firstEl.focus();
    });
  }

  window.addEventListener('hashchange', () => {
    const toolFromHash = getToolFromHash();
    if (toolFromHash && toolFromHash !== activeTool) {
      loadTool(toolFromHash, false);
    }
  });

  langSelect.onchange = (e) => {
    currentLang = e.target.value;
    storage.set('tempo_lang', currentLang);
    updateStaticTexts();
    loadTool(activeTool);
  };

  logoBtn.addEventListener('click', () => { closeDrawer(); loadTool('date'); });
  openMenuBtn.addEventListener('click', openDrawer);
  closeMenuBtn.addEventListener('click', closeDrawer);
  drawer.addEventListener('click', (e) => { if (e.target === drawer) closeDrawer(); });

  document.querySelectorAll(".menu-item").forEach(item => {
    item.addEventListener('click', () => {
      closeDrawer();
      loadTool(item.dataset.tool);
    });
  });

  updateStaticTexts();
  loadTool(activeTool);
});
</script>
</body>
</html>
